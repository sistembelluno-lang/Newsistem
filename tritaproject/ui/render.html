<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:">
<script src="../node_modules/pdfjs-dist/build/pdf.min.js"></script>
</head><body>
<script>
// Finestra nascosta: disegna pagine dei PDF e converte gli SVG in PNG. La comanda main.js con executeJavaScript.
pdfjsLib.GlobalWorkerOptions.workerSrc = '../node_modules/pdfjs-dist/build/pdf.worker.min.js';
const aperti = new Map();

async function apriPdf(chiave, base64) {
  if (!aperti.has(chiave)) {
    const dati = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
    aperti.set(chiave, await pdfjsLib.getDocument({ data: dati, isEvalSupported: false }).promise);
    if (aperti.size > 6) { const [k, d] = aperti.entries().next().value; d.destroy(); aperti.delete(k); }
  }
  return aperti.get(chiave).numPages;
}
const giaAperto = (chiave) => aperti.has(chiave);

// Disegna una pagina (o un suo riquadro, in frazioni 0-1) con il lato lungo di «lato» pixel.
async function pagina(chiave, n, zona, lato) {
  const pdf = aperti.get(chiave);
  if (n < 1 || n > pdf.numPages) throw new Error(`pagina ${n} inesistente: il documento ha ${pdf.numPages} pagine`);
  const pg = await pdf.getPage(n);
  const vista1 = pg.getViewport({ scale: 1 });
  const z = zona || { x0: 0, y0: 0, x1: 1, y1: 1 };
  const x0 = Math.max(0, Math.min(z.x0, z.x1)), x1 = Math.min(1, Math.max(z.x0, z.x1));
  const y0 = Math.max(0, Math.min(z.y0, z.y1)), y1 = Math.min(1, Math.max(z.y0, z.y1));
  const w = (x1 - x0) * vista1.width, h = (y1 - y0) * vista1.height;
  if (w < 1 || h < 1) throw new Error('zona troppo piccola');
  const scala = Math.min(lato / Math.max(w, h), 12); // oltre 12x il PDF non ha più dettaglio
  const vista = pg.getViewport({ scale: scala, offsetX: -x0 * vista1.width * scala, offsetY: -y0 * vista1.height * scala });
  const c = document.createElement('canvas');
  c.width = Math.round(w * scala); c.height = Math.round(h * scala);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await pg.render({ canvasContext: ctx, viewport: vista }).promise;
  if (!zona) griglia(ctx, c.width, c.height);
  pg.cleanup();
  return { dati: c.toDataURL('image/jpeg', 0.88).split(',')[1], larghezza: c.width, altezza: c.height, pagine: pdf.numPages, formato_pt: [Math.round(vista1.width), Math.round(vista1.height)] };
}

// Griglia con le coordinate in frazioni, per scegliere poi la zona da ingrandire.
function griglia(ctx, W, H) {
  const n = 10;
  ctx.save();
  ctx.strokeStyle = 'rgba(220,0,120,.45)'; ctx.lineWidth = Math.max(1, W / 1600);
  ctx.fillStyle = 'rgba(220,0,120,.9)'; ctx.font = `bold ${Math.max(11, Math.round(Math.min(W, H) / 70))}px Arial`;
  for (let i = 1; i < n; i++) {
    const x = (W * i) / n, y = (H * i) / n;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillText((i / n).toFixed(1), x + 3, 14 + 2);
    ctx.fillText((i / n).toFixed(1), 3, y - 3);
  }
  ctx.restore();
}

// Vettori di una pagina: linee (con layer CAD se il PDF li ha, altrimenti colore) e testi, in punti con y verso l'alto.
// Con «zona» (frazioni 0-1) tiene solo ciò che vi ricade e porta l'origine nell'angolo in basso a sinistra della zona.
async function vettori(chiave, n, zona) {
  const pdf = aperti.get(chiave);
  if (n < 1 || n > pdf.numPages) throw new Error(`pagina ${n} inesistente: il documento ha ${pdf.numPages} pagine`);
  const pg = await pdf.getPage(n);
  const vp = pg.getViewport({ scale: 1 });
  const W = vp.width, H = vp.height;
  const z = zona ? { x0: Math.min(zona.x0, zona.x1) * W, x1: Math.max(zona.x0, zona.x1) * W, y0: Math.min(zona.y0, zona.y1) * H, y1: Math.max(zona.y0, zona.y1) * H } : { x0: 0, x1: W, y0: 0, y1: H };
  const dentro = (x, y) => x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1;
  let nomiOC = null;
  try { const cfg = await pdf.getOptionalContentConfig(); nomiOC = (id) => { try { return cfg.getGroup(id)?.name || null; } catch (e) { return null; } }; } catch (e) { /* PDF senza layer */ }
  const O = pdfjsLib.OPS;
  const mul = (m, q) => [m[0] * q[0] + m[2] * q[1], m[1] * q[0] + m[3] * q[1], m[0] * q[2] + m[2] * q[3], m[1] * q[2] + m[3] * q[3], m[0] * q[4] + m[2] * q[5] + m[4], m[1] * q[4] + m[3] * q[5] + m[5]];
  let ctm = vp.transform.slice(); // spazio PDF → foglio (y verso il basso)
  let colore = '#000000', riemp = '#000000';
  const pila = [], oc = [];
  let path = [], cur = null, inizio = null;
  const linee = [];
  const T = (x, y) => [ctm[0] * x + ctm[2] * y + ctm[4], ctm[1] * x + ctm[3] * y + ctm[5]];
  const nuovo = (p) => { cur = [p[0], p[1]]; inizio = p; path.push(cur); };
  const add = (p) => { if (!cur) nuovo(p); else cur.push(p[0], p[1]); };
  const curva = (p0, c1, c2, p3) => { for (let i = 1; i <= 8; i++) { const t = i / 8, u = 1 - t; add([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p3[1]]); } };
  const ultimo = () => (cur ? [cur[cur.length - 2], cur[cur.length - 1]] : [0, 0]);
  // Taglio di un segmento sul riquadro della zona (Liang-Barsky): null se è tutto fuori.
  const taglia = (x1, y1, x2, y2) => {
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    for (const [p, q] of [[-dx, x1 - z.x0], [dx, z.x1 - x1], [-dy, y1 - z.y0], [dy, z.y1 - y1]]) {
      if (p === 0) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [x1 + t0 * dx, y1 + t0 * dy, x1 + t1 * dx, y1 + t1 * dy, t0 > 0, t1 < 1];
  };
  const dipingi = (riempito) => {
    const l = oc.filter(Boolean).pop() || null;
    const c = riempito ? riemp : colore;
    const esci = (q) => { if (q.length >= 4) linee.push({ p: q.map((v, i) => +(i % 2 ? z.y1 - v : v - z.x0).toFixed(2)), c, l, r: riempito ? 1 : 0 }); };
    for (const p of path) {
      if (p.length < 4) continue;
      let q = [];
      for (let i = 0; i + 3 < p.length; i += 2) {
        const s = taglia(p[i], p[i + 1], p[i + 2], p[i + 3]);
        if (!s) { esci(q); q = []; continue; }
        if (!q.length || s[4]) { esci(q); q = [s[0], s[1]]; }
        q.push(s[2], s[3]);
        if (s[5]) { esci(q); q = []; }
      }
      esci(q);
    }
    path = []; cur = null;
  };
  const ops = await pg.getOperatorList();
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], a = ops.argsArray[i];
    switch (fn) {
      case O.save: pila.push([ctm, colore, riemp]); break;
      case O.restore: if (pila.length) [ctm, colore, riemp] = pila.pop(); break;
      case O.transform: ctm = mul(ctm, a); break;
      case O.paintFormXObjectBegin: pila.push([ctm, colore, riemp]); if (a[0]) ctm = mul(ctm, a[0]); break;
      case O.paintFormXObjectEnd: if (pila.length) [ctm, colore, riemp] = pila.pop(); break;
      case O.setStrokeRGBColor: colore = '#' + [a[0], a[1], a[2]].map((v) => (v | 0).toString(16).padStart(2, '0')).join(''); break;
      case O.setFillRGBColor: riemp = '#' + [a[0], a[1], a[2]].map((v) => (v | 0).toString(16).padStart(2, '0')).join(''); break;
      case O.beginMarkedContentProps: oc.push(a[0] === 'OC' && a[1] && nomiOC ? nomiOC(a[1].id) : null); break;
      case O.beginMarkedContent: oc.push(null); break;
      case O.endMarkedContent: oc.pop(); break;
      case O.constructPath: {
        const [sub, args] = a;
        let k = 0;
        for (const s of sub) {
          if (s === O.moveTo) { nuovo(T(args[k], args[k + 1])); k += 2; }
          else if (s === O.lineTo) { add(T(args[k], args[k + 1])); k += 2; }
          else if (s === O.curveTo) { curva(ultimo(), T(args[k], args[k + 1]), T(args[k + 2], args[k + 3]), T(args[k + 4], args[k + 5])); k += 6; }
          else if (s === O.curveTo2) { const p0 = ultimo(); curva(p0, p0, T(args[k], args[k + 1]), T(args[k + 2], args[k + 3])); k += 4; }
          else if (s === O.curveTo3) { const p3 = T(args[k + 2], args[k + 3]); curva(ultimo(), T(args[k], args[k + 1]), p3, p3); k += 4; }
          else if (s === O.closePath) { if (cur && inizio) add(inizio); }
          else if (s === O.rectangle) {
            const [x, y, w, h] = args.slice(k, k + 4); k += 4;
            nuovo(T(x, y)); add(T(x + w, y)); add(T(x + w, y + h)); add(T(x, y + h)); add(T(x, y));
          }
        }
        break;
      }
      case O.stroke: case O.closeStroke: case O.fillStroke: case O.eoFillStroke: case O.closeFillStroke: case O.closeEOFillStroke: dipingi(false); break;
      case O.fill: case O.eoFill: dipingi(true); break;
      case O.endPath: path = []; cur = null; break;
    }
  }
  const testi = [];
  const tc = await pg.getTextContent();
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const m = mul(vp.transform, it.transform);
    const x = m[4], y = m[5];
    if (!dentro(x, y)) continue;
    testi.push({ s: it.str, x: +(x - z.x0).toFixed(2), y: +(z.y1 - y).toFixed(2), h: +Math.hypot(it.transform[2], it.transform[3]).toFixed(2), r: +((Math.atan2(it.transform[1], it.transform[0]) * 180) / Math.PI).toFixed(2) });
  }
  pg.cleanup();
  return { linee, testi, larghezza: z.x1 - z.x0, altezza: z.y1 - z.y0, foglio: [W, H] };
}

// Testo di tutte le pagine (per la ricerca nel progetto): righe ricostruite dalla posizione dei frammenti.
async function testoPagine(chiave) {
  const pdf = aperti.get(chiave);
  const out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const pg = await pdf.getPage(n);
    const tc = await pg.getTextContent();
    let riga = null, testo = '';
    for (const it of tc.items) {
      if (!it.str) continue;
      const y = Math.round(it.transform[5]);
      testo += riga === null ? it.str : Math.abs(y - riga) > 2 ? '\n' + it.str : (it.str.startsWith(' ') || testo.endsWith(' ') ? '' : ' ') + it.str;
      riga = y;
    }
    out.push(testo);
    pg.cleanup();
  }
  return out;
}

// Confronto di due pagine (es. due revisioni della stessa tavola): in rosso ciò che c'era solo nella prima,
// in blu ciò che c'è solo nella seconda, in grigio le parti uguali. Restituisce anche le zone cambiate.
async function confronto(chiaveA, nA, chiaveB, nB, lato) {
  const disegna = async (chiave, n, W, H) => {
    const pg = await aperti.get(chiave).getPage(n);
    const v1 = pg.getViewport({ scale: 1 });
    const s = Math.min(W / v1.width, H / v1.height);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    await pg.render({ canvasContext: ctx, viewport: pg.getViewport({ scale: s }) }).promise;
    pg.cleanup();
    return ctx.getImageData(0, 0, W, H).data;
  };
  const v = (await aperti.get(chiaveA).getPage(nA)).getViewport({ scale: 1 });
  const k = lato / Math.max(v.width, v.height);
  const W = Math.round(v.width * k), H = Math.round(v.height * k);
  const a = await disegna(chiaveA, nA, W, H), b = await disegna(chiaveB, nB, W, H);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), img = ctx.createImageData(W, H), o = img.data;
  const G = 20, celle = new Array(G * G).fill(0);
  let diversi = 0, scuri = 0;
  for (let i = 0; i < a.length; i += 4) {
    const la = (a[i] + a[i + 1] + a[i + 2]) / 3 < 160, lb = (b[i] + b[i + 1] + b[i + 2]) / 3 < 160;
    let col = [255, 255, 255];
    if (la && lb) col = [170, 170, 170];
    else if (la) col = [220, 0, 0];
    else if (lb) col = [0, 70, 230];
    if (la || lb) scuri++;
    if (la !== lb) { diversi++; const p = i / 4, x = p % W, y = (p / W) | 0; celle[((y * G) / H | 0) * G + ((x * G) / W | 0)]++; }
    o[i] = col[0]; o[i + 1] = col[1]; o[i + 2] = col[2]; o[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const soglia = Math.max(20, (W * H) / (G * G) * 0.004);
  const zone = [];
  celle.forEach((n, i) => { if (n > soglia) zone.push({ x0: (i % G) / G, y0: ((i / G) | 0) / G, x1: (i % G + 1) / G, y1: (((i / G) | 0) + 1) / G, pixel: n }); });
  zone.sort((p, q) => q.pixel - p.pixel);
  return { dati: c.toDataURL('image/png').split(',')[1], diversi: scuri ? diversi / scuri : 0, zone: zone.slice(0, 15) };
}

function svgPng(svg, lato) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const w0 = img.naturalWidth || 1000, h0 = img.naturalHeight || 700;
      const k = lato / Math.max(w0, h0);
      const c = document.createElement('canvas');
      c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => ko(new Error('SVG non valido: il disegno non si apre'));
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  });
}
</script>
