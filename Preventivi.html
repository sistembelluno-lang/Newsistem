<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREVENTIVI_SISTEM</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#0f1b2d;--mu:#5d6b82;--bd:#dfe5ef;--nv:#012549;--or:#f94208;--ok:#13804f;--ko:#c2372b;--hd:#f3f6fb;--in:#fff;
  --sh:0 1px 2px rgba(15,27,45,.06),0 8px 22px rgba(15,27,45,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111d;--card:#141c2c;--tx:#e8edf6;--mu:#93a1b8;--bd:#25314a;--ok:#46c98d;--ko:#ff7d6e;--hd:#1a2438;--in:#0f1626;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;font-size:14px;color:var(--tx);background:var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:600;white-space:nowrap}
button:hover{border-color:#8fa3c4}
button.p{background:linear-gradient(135deg,#0b3a75,var(--nv));border-color:var(--nv);color:#fff}
button.o{background:linear-gradient(135deg,#ff6a2b,var(--or));border-color:var(--or);color:#fff}
button.d{color:var(--ko)}
button.s{padding:4px 9px;font-size:12.5px;border-radius:7px}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--in);border-radius:8px;padding:7px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#3d6fd1;box-shadow:0 0 0 3px rgba(61,111,209,.15)}
textarea{resize:vertical;line-height:1.4}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:600}
label>input,label>select,label>textarea{margin-top:4px;font-weight:400;font-size:14px}
label.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:500;font-size:13.5px}
label.ck input{width:auto;margin:0}
[hidden]{display:none!important}
/* Barra con il marchio */
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 20px;color:#fff;
  background:linear-gradient(110deg,#00152c 0%,var(--nv) 55%,#0b3a75 100%);box-shadow:0 6px 20px rgba(1,20,45,.3);border-bottom:3px solid var(--or)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{flex:none;background:#fff;border-radius:10px;padding:3px 6px;display:flex;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand .lg img{height:34px;display:block}
.brand .az{display:block;font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.8;white-space:nowrap}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.03em;line-height:1.15;white-space:nowrap}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.nav button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.nav button:hover{background:rgba(255,255,255,.2)}
.nav button.on{background:#fff;color:var(--nv)}
.nav button.o{background:var(--or);border-color:var(--or)}
#sst{font-size:12px;opacity:.85;white-space:nowrap}
main{padding:18px 20px 40px;max-width:1700px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
.muted{color:var(--mu);font-size:12.5px}
/* Archivio */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:11px 14px;border-top:3px solid var(--nv)}
.kpi div:nth-child(2n){border-top-color:var(--or)}
.kpi small{display:block;color:var(--mu);font-weight:600;font-size:12px}
.kpi b{font-size:21px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{width:auto;min-width:160px}
.tools input#q{flex:1;min-width:220px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);box-shadow:var(--sh)}
table.lst{width:100%;border-collapse:collapse;font-size:13.5px}
.lst th{position:sticky;top:0;background:var(--hd);text-align:left;font-size:12px;color:var(--mu);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.lst td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.lst tbody tr{cursor:pointer}
.lst tbody tr:hover{background:var(--hd)}
.lst .n{text-align:right;white-space:nowrap}
.lst .w{min-width:240px}
.lst .ac{white-space:nowrap;text-align:right}
.lst .ac button{margin-left:4px}
.em{text-align:center;color:var(--mu);padding:30px!important}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--hd);border:1px solid var(--bd);white-space:nowrap}
.t-bozza{color:var(--mu)}
.t-inviata{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.35);color:#1d4ed8}
.t-accettata{background:rgba(19,128,79,.13);border-color:rgba(19,128,79,.4);color:var(--ok)}
.t-rifiutata{background:rgba(194,55,43,.1);border-color:rgba(194,55,43,.35);color:var(--ko)}
.cm{font-weight:700;color:var(--nv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cm{color:#8fb4ff}:root:not([data-theme="light"]) .t-inviata{color:#7aa2ff}}
/* Editor */
.ed{display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,1.05fr);gap:16px;align-items:start}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.edbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.edbar h2{margin:0;font-size:17px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.sec>h3{margin:0;padding:9px 14px;font-size:12.5px;letter-spacing:.12em;color:#fff;background:linear-gradient(110deg,var(--nv),#0b3a75);border-bottom:2px solid var(--or);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 small{letter-spacing:0;font-weight:500;opacity:.8}
.sec .in{padding:12px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
.hint{font-size:12px;color:var(--mu);font-weight:400;margin-top:3px}
.vo{display:grid;grid-template-columns:26px 1fr 130px 130px 34px;gap:8px;align-items:center;margin-bottom:8px}
.vo b{color:var(--mu);text-align:right}
.tot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;background:var(--hd);border-radius:10px;padding:8px 12px}
.tot b{color:var(--nv)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tot b{color:#8fb4ff}}
.pv{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:#5b6577;border-radius:14px;padding:14px;box-shadow:var(--sh)}
.pv .pg{margin:0 auto;transform-origin:top left}
.sheet{width:210mm;background:#fff;color:#000;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:0 0 6mm}
.sheet .hd{padding-top:8mm}
.sheet .bd{padding:6mm 18mm 4mm}
.warn{color:var(--ko);font-size:12.5px;font-weight:600}
.okc{color:var(--ok);font-size:12.5px;font-weight:600}
/* Dialoghi */
dialog{border:none;border-radius:16px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--card);color:var(--tx);width:min(720px,94vw)}
dialog::backdrop{background:rgba(5,15,35,.5)}
dialog .dh{padding:14px 18px;background:linear-gradient(110deg,var(--nv),#0b3a75);color:#fff;border-bottom:3px solid var(--or);display:flex;justify-content:space-between;align-items:center}
dialog .dh h2{margin:0;font-size:16px}
dialog .dh button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
dialog .db{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.g2 .f{grid-column:1/-1}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mods button{text-align:left;white-space:normal;padding:12px;border-radius:12px;height:100%}
.mods button b{display:block;color:var(--nv);margin-bottom:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mods button b{color:#8fb4ff}}
.mods button span{font-weight:400;font-size:12.5px;color:var(--mu)}
.mods .x{float:right;color:var(--ko);font-weight:700;padding:0 4px}
h4{margin:14px 0 8px;font-size:13px;letter-spacing:.08em;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;z-index:99;max-width:90vw}
@media (max-width:1100px){.ed{grid-template-columns:1fr}.pv{position:static;max-height:none}}
@media (max-width:640px){.sec .in{grid-template-columns:1fr 1fr}.c3,.c4,.c6{grid-column:1/-1}.vo{grid-template-columns:20px 1fr 100px 34px}.vo .u{display:none}.appbar{flex-wrap:wrap}main{padding:12px}}
#printArea{display:none}
@media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="lg"><img id="blogo" alt="SISTEM"></span><div><span class="az">SISTEM SRL STP</span><h1>PREVENTIVI_SISTEM</h1></div></div>
  <div class="nav">
    <span id="sst"></span>
    <button id="nArch" class="on">📁 Archivio offerte</button>
    <button id="nNew" class="o">+ Nuova offerta</button>
    <button id="nSet">⚙ Impostazioni</button>
  </div>
</header>

<main id="vArch">
  <div class="kpi" id="kpi"></div>
  <div class="tools">
    <input id="q" placeholder="Cerca per numero, cliente, oggetto, commessa…">
    <select id="fst"><option value="">Tutti gli stati</option><option value="bozza">Bozza</option><option value="inviata">Inviata</option><option value="accettata">Accettata</option><option value="rifiutata">Rifiutata</option></select>
    <select id="fan"><option value="">Tutti gli anni</option></select>
    <button id="csv">Esporta Excel</button>
    <button id="expf">📂 Cartella offerte</button>
  </div>
  <div class="tw"><table class="lst"><thead><tr><th>N. rif.</th><th>Data</th><th>Cliente</th><th class="w">Oggetto</th><th class="n">Importo</th><th>Stato</th><th>Commessa</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="muted" id="cnt"></p>
</main>

<main id="vEd" hidden>
  <div class="edbar">
    <h2 id="edt"></h2>
    <div class="btns">
      <button id="eBack">← Archivio</button>
      <button id="eMod">Salva come modello</button>
      <button id="eDup">Duplica</button>
      <button id="ePrev">👁 Anteprima PDF</button>
      <button id="eWord" class="p">⬇ Word (.docx)</button>
      <button id="ePdf" class="o">⬇ PDF</button>
    </div>
  </div>
  <div class="ed">
    <div id="frm"></div>
    <div class="pv" id="pv"><div class="pg" id="pg"></div></div>
  </div>
</main>

<dialog id="dNew"><div class="dh"><h2>Nuova offerta</h2><button class="s" data-close>✕</button></div><div class="db" id="dNewB"></div></dialog>
<dialog id="dSet"><div class="dh"><h2>Impostazioni</h2><button class="s" data-close>✕</button></div><div class="db" id="dSetB"></div><div class="df"><button data-close>Chiudi</button></div></dialog>
<dialog id="dMod"><div class="dh"><h2>Salva come modello</h2><button class="s" data-close>✕</button></div><div class="db"><label>Nome del modello<input id="modN" placeholder="es. Rilievo GPS"></label><p class="muted">Il modello tiene testi e voci dell’offerta, non cliente, numero e data.</p></div><div class="df"><button data-close>Annulla</button><button class="p" id="modOk">Salva modello</button></div></dialog>
<dialog id="dAsk"><div class="dh"><h2>Conferma</h2></div><div class="db" id="askm"></div><div class="df"><button id="askn">Annulla</button><button class="p" id="asky">Conferma</button></div></dialog>
<div id="toast"></div>
<div id="printArea"></div>

function genNum(iso,skipId){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||oggi())||[];const base=D.set.pref+(+m[3])+m[2]+String(m[1]).slice(2);

const r2=x=>Math.round((x+Number.EPSILON)*100)/100;

async function shLoad(){if(!SH.dir)return;try{const t=await window.desktop.shRead('codici.json');SH.cod=t?JSON.parse(String(t).replace(/^﻿/,'')):null;SH.err=''}catch(e){SH.err=errMsg(e)}}
function pubOff(){if(!SH.dir)return;clearTimeout(pubOff.t);pubOff.t=setTimeout(async()=>{
  const off=D.prev.filter(p=>p.num).map(p=>({id:p.id,num:p.num,data:p.data,stato:p.stato,commessa:String(p.commessa||''),cliente:p.cli.ditta||'',loc:(p.cli.loc||'').replace(/\n/g,' '),ogg:p.ogg||'',imp:totals(p).imp,tempi:p.tempi&&p.tempi!=='---'?p.tempi:''}));
  try{await window.desktop.shWrite('offerte.json',JSON.stringify({agg:Date.now(),da:'PREVENTIVI_SISTEM',off}));SH.pub=Date.now();SH.err=''}catch(e){SH.err=errMsg(e)}},900)}
const codNum=x=>{const s=String(x??'').trim();return/^\d+$/.test(s)?+s:0};
function nextCommessa(skipId){const L=(SH.cod&&SH.cod.lav)||[];const a=[...L.map(l=>codNum(l.cod)),codNum(SH.cod&&SH.cod.max),...D.prev.filter(p=>p.id!==skipId).map(p=>codNum(p.commessa))];return String(Math.max(0,...a)+1)}
const inControllo=c=>!!(c&&SH.cod&&(SH.cod.lav||[]).some(l=>String(l.cod).trim()===String(c).trim()));

function blocks(p){const s=D.set,B=[],e=p.eco,h=t=>B.push({k:'h',t});
  B.push({k:'rif',num:p.num,luogo:p.luogo,data:dIt(p.data)});
  B.push({k:'tit',t1:TITOLO,t2:p.ogg});
  h(SEZ.cli);B.push({k:'cli',ditta:p.cli.ditta,loc:p.cli.loc,ca:p.cli.ca?(p.cli.caT==='C.a.'?'C.a. - ':p.cli.caT+' ')+p.cli.ca:''});
  h(SEZ.pre);if(p.premessa)B.push({k:'p',t:p.premessa});
  h(SEZ.tec);
  if(p.generale)B.push({k:'p',lab:'Offerta generale:',t:p.generale});
  if(p.descr)B.push({k:'p',lab:'Descrizione dell’attività:',t:p.descr});
  const att=String(p.att||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(att.length){B.push({k:'p',t:'Attività :'});B.push({k:'ul',items:att})}
  if(p.escl)B.push({k:'p',t:p.escl});
  if(p.tempi)B.push({k:'p',lab:'Tempistiche:',t:p.tempi});
  h(SEZ.eco);
  if(e.intro)B.push({k:'p',t:e.intro});
  if(e.spese&&e.speseT)B.push({k:'p',t:e.speseT});
  B.push({k:'p',t:`L’offerta seguente è ${e.mod||'a corpo'}:`});
  (e.voci||[]).filter(v=>v.d||v.imp!=='').forEach((v,i)=>B.push({k:'voce',n:i+1,d:v.d,e:`Euro ${fmt(v.imp)}${v.u?' '+v.u:''} + cont prev ${pct(s.cp)}% + iva ${pct(s.iva)}%`}));
  if(e.riep){const t=totals(p);B.push({k:'tot',rows:[['Imponibile',eur(t.imp)],[`Contributo previdenziale ${pct(s.cp)}%`,eur(t.cp)],[`IVA ${pct(s.iva)}%`,eur(t.iva)],['Totale offerta',eur(t.tot)]]})}
  const nl=String(e.note||'').split('\n').filter(x=>x.trim());if(nl.length)B.push({k:'note',lines:nl});
  if(p.brk)B.push({k:'brk'});
  h(SEZ.val);B.push({k:'p',t:`La presente offerta ha validità di ${p.val||30} giorni dalla data di emissione.`});
  h(SEZ.foro);B.push({k:'p',t:`Per qualsiasi controversia, il foro competente sarà quello di ${p.foro||'Belluno'}.`});
  h(SEZ.pag);B.push({k:'p',t:`Il pagamento dovrà essere effettuato entro ${p.term||''} a seguito della/e fattura/e per mezzo bonifico bancario emesse con il seguente ordine: **${p.ordine||''}**`});
  if(s.banca)B.push({k:'p',t:s.banca});
  B.push({k:'p',it:1,t:RISCONTRO});B.push({k:'p',t:SALUTI});
  B.push({k:'firma',f:s.firma,timbro:p.timbro});
  return B}

function docHTML(p,prev){return blocks(p).map(b=>{switch(b.k){
  case'rif':return`<div class="rif"><div class="n">NS.RIF. : <b>${esc(b.num)}</b></div><div class="d">${esc(b.luogo)}, ${esc(b.data)}</div></div>`;
  case'tit':return`<div class="tit"><div class="t1">${esc(b.t1)}</div>${b.t2?`<div class="t2">${tx(b.t2)}</div>`:''}</div>`;
  case'h':return`<h2>${esc(b.t)}</h2>`;
  case'cli':return`<div class="cli"><div class="lb">DITTA</div><div class="dt">${tx(b.ditta)||'&nbsp;'}</div>${b.loc?`<div>${tx(b.loc)}</div>`:''}${b.ca?`<div style="margin-top:3pt">${tx(b.ca)}</div>`:''}</div>`;
  case'p':return`<p${b.it?' class="it"':''}>${b.lab?`<b>${esc(b.lab)}</b> `:''}${tx(b.t)}</p>`;
  case'ul':return`<ul>${b.items.map(i=>`<li>${tx(i)}</li>`).join('')}</ul>`;
  case'voce':return`<div class="voce"><b>${b.n}.&nbsp;&nbsp;&nbsp;${tx(b.d)}</b><div class="e">${esc(b.e)}</div></div>`;
  case'tot':return`<table class="tt">${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
  case'note':return`<div class="note">${b.lines.map(l=>`<div>${tx(l)}</div>`).join('')}</div>`;
  case'brk':return prev?'<div style="margin:18pt -18mm;border-top:2px dashed #b9c2d0;text-align:center;font-size:8pt;color:#8a94a6;line-height:0"><span style="background:#fff;padding:0 8px">nuova pagina</span></div>':'<div class="brk"></div>';
  case'firma':return`<div class="firma"><div class="acc"><p>Accettazione offerta:</p><p>Firma_______________________</p><p>Data_______________________</p></div><div class="sig">${esc(b.f.soc)}<br>${esc(b.f.ruolo)}<br>${esc(b.f.nome)}${b.timbro&&IMG.timbro?`<img src="${IMG.timbro}" alt="">`:''}</div></div>`;
  default:return''}}).join('')}

function fitPv(){const pv=$('pv'),pg=$('pg');const w=pv.clientWidth-28,sh=pg.firstElementChild;if(!sh)return;const z=Math.min(1,w/sh.offsetWidth);pg.style.zoom=z}
addEventListener('resize',fitPv);
$('eBack').onclick=()=>show('arch');
$('ePdf').onclick=()=>expPdf(cur);$('ePrev').onclick=()=>expPdf(cur,true);$('eWord').onclick=()=>expDocx(cur);
$('eDup').onclick=()=>openEd(dup(cur));
$('eMod').onclick=()=>{$('modN').value=cur.ogg.slice(0,60);$('dMod').showModal();$('modN').select()};
$('modN').onkeydown=e=>{if(e.key==='Enter')$('modOk').click()};
$('modOk').onclick=()=>{const nome=$('modN').value.trim();if(!nome){$('modN').focus();return}$('dMod').close();
  const x=clone(cur);['id','num','data','luogo','stato','commessa','cli','creato','mod'].forEach(k=>delete x[k]);D.modelli.push({id:nid(),nome,desc:cur.ogg,p:x});save();toast('Modello «'+nome+'» salvato')};

// ===== Impostazioni =====
function renderSet(){const s=D.set,a=s.az,i=(k,l,v,o='')=>`<label${o}>${l}<input data-s="${k}" value="${esc(v)}"></label>`;
  $('dSetB').innerHTML=`<h4 style="margin-top:0">COLLEGAMENTO CON CONTROLLO_SISTEM</h4><p style="margin:0 0 8px">Cartella condivisa sul server (la stessa scelta in CONTROLLO_SISTEM → 👥 Ore dipendenti → Impostazioni): <b>${SH.dir?esc(SH.dir):'non scelta'}</b> ${SH.err?`<span class="warn">⚠ ${esc(SH.err)}</span>`:SH.pub?'<span class="okc">✓ offerte pubblicate</span>':''}</p>
<p style="margin:0 0 6px"><button id="shc">Scegli cartella condivisa…</button></p>
<div style="display:flex;gap:8px;align-items:center;margin:0 0 6px"><input id="shp" placeholder="oppure scrivi il percorso, es. \\\\SERVER\\ControlloLavori" value="${esc(SH.dir)}"><button id="shs">Usa questo percorso</button></div>
<p class="muted" style="margin:0 0 6px">Nella finestra «Scegli cartella condivisa…» seleziona la cartella con un clic (o entraci) e premi <b>«Seleziona cartella»</b> in basso a destra. Se PREVENTIVI_SISTEM è sullo stesso PC di CONTROLLO_SISTEM, la cartella viene presa da sola.</p><p class="muted">Qui PREVENTIVI_SISTEM scrive <b>offerte.json</b>: in CONTROLLO_SISTEM il pulsante «📄 Offerte» le elenca e crea il lavoro con il codice commessa, il rif. offerta, il cliente e l’importo. Da <b>codici.json</b> legge i codici già usati per proporre la commessa successiva.</p><h4>CARTA INTESTATA</h4><div class="g2">${i('az.rag','Ragione sociale',a.rag)}${i('az.ind','Indirizzo',a.ind)}${i('az.tel','Telefono',a.tel)}${i('az.email','E-mail',a.email)}${i('az.pec','PEC',a.pec)}${i('az.web','Sito web',a.web)}${i('az.piva','C.F. / P.IVA (piè di pagina)',a.piva)}</div>
<h4>VALORI PREDEFINITI</h4><div class="g2">${i('pref','Prefisso numero offerta',s.pref)}${i('luogo','Luogo',s.luogo)}${i('cp','Contributo previdenziale %',s.cp)}${i('iva','IVA %',s.iva)}${i('conto','Apertura conto dedicato €',s.conto)}${i('val','Validità (giorni)',s.val)}${i('foro','Foro competente',s.foro)}${i('term','Pagamento entro',s.term)}
<label class="f">Coordinate bancarie<textarea data-s="banca" rows="2">${esc(s.banca)}</textarea></label>${i('firma.soc','Firma: società',s.firma.soc)}${i('firma.ruolo','Firma: ruolo',s.firma.ruolo)}${i('firma.nome','Firma: nome',s.firma.nome,' class="f"')}</div>
<p class="muted">Contributo, IVA e carta intestata valgono per tutte le offerte; le note con l’asterisco delle nuove offerte usano questi valori.</p>
<h4>DOVE SONO I DATI</h4><p style="margin:0 0 8px" id="sdir"></p><p style="margin:0 0 6px"><button id="schoose">Cambia cartella…</button> <button id="sopen">Apri cartella</button></p>
`;
  if(DESK)window.desktop.init().then(r=>{$('sdir').innerHTML='File: <b>'+esc(r.file)+'</b>'});else $('sdir').textContent='Versione di prova nel browser: i dati restano in questo browser.'}
$('dSetB').addEventListener('input',e=>{const k=e.target.dataset.s;if(!k)return;let v=e.target.value;if(['cp','iva','conto','val'].includes(k))v=num(v);setK(D.set,k,v);save();if(cur){renderForm();preview()}});
$('dSetB').addEventListener('click',async e=>{const id=e.target.id;
  if(id==='schoose'&&DESK){const r=await window.desktop.choose();if(!r)return;if(r.exists&&r.data&&await ask('Nella cartella c’è già un file di offerte. Caricare quelle offerte al posto di quelle aperte ora?')){load(r.data)}else save();renderSet();renderArch()}
  if(id==='sopen'&&DESK)window.desktop.open();
  if(id==='shs'&&DESK){const r=await window.desktop.shSet($('shp').value);if(!r.ok){toast(r.error,5000);return}SH.dir=r.dir;await shLoad();pubOff();toast('Cartella condivisa impostata');setTimeout(renderSet,1500);renderSet()}
  if(id==='shc'&&DESK){const r=await window.desktop.shChoose();if(r&&r.dir){SH.dir=r.dir;await shLoad();pubOff();setTimeout(renderSet,1500);renderSet()}}});
$('nSet').onclick=()=>{renderSet();$('dSet').showModal()};
$('dSet').onclose=()=>{if(!cur)renderArch()};

// ===== Avvio =====
function load(json){try{const j=JSON.parse(String(json).replace(/^﻿/,''));if(j&&Array.isArray(j.prev)){D=j;mig();return true}}catch(e){toast('File delle offerte illeggibile: '+e.message,6000)}return false}
(async()=>{$('blogo').src=IMG.logo||'';document.head.insertAdjacentHTML('beforeend','<style>'+DOC_CSS+'</style>');
  if(DESK){const r=await window.desktop.init();if(r.exists&&r.data)load(r.data);else{try{const j=localStorage.getItem('preventivi_sistem_v1');if(j)load(j)}catch(e){}}document.title='PREVENTIVI_SISTEM '+(r.ver||'')}
  else{try{const j=localStorage.getItem('preventivi_sistem_v1');if(j)load(j)}catch(e){}}
  mig();show('arch');await shInit();renderArch();
  setInterval(async()=>{if(SH.dir){await shLoad();if(!cur)renderArch();else upd()}},60000);
  addEventListener('focus',async()=>{if(SH.dir){await shLoad();if(!cur)renderArch();else upd()}})})();
</script>
</body>
</html>
