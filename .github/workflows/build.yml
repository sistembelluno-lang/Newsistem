name: Build eseguibili

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Una nuova spinta annulla la compilazione precedente ancora in corso
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            name: Windows
          - os: windows-latest
            cmd: dist:win7
            name: Windows7-32bit
          - os: macos-latest
            cmd: dist:mac
            name: macOS
          - os: ubuntu-latest
            cmd: dist:linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Programmi-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # Pagina di download: una Release con i programmi per Windows, aggiornata a ogni versione
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Programmi-Windows*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CONTROLLO_SISTEM e INSERT_SISTEM ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            out/*.exe
            guida/Manuale_CONTROLLO_SISTEM.pdf
          body: |
            **Manuale di installazione e d'uso**: `Manuale_CONTROLLO_SISTEM.pdf` (qui sotto, in Assets).

            **Quale file scaricare**

            | PC | Programma | File |
            |---|---|---|
            | Amministratore (Windows 7 32 bit) | CONTROLLO_SISTEM | `CONTROLLO_SISTEM-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` |
            | Dipendenti (qualsiasi Windows) | INSERT_SISTEM | `INSERT_SISTEM-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` |

            I file *Windows7-32bit* funzionano su Windows 7, 8, 10 e 11. Le versioni *portable* partono senza installazione; quelle senza «Windows7» sono per Windows 10/11 a 64 bit.
            Al primo avvio Windows può mostrare un avviso: «Ulteriori informazioni» → «Esegui comunque».
