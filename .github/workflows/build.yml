name: Build eseguibili

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Una nuova spinta annulla la compilazione precedente ancora in corso
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            name: Windows
          - os: windows-latest
            cmd: dist:win7
            name: Windows7-32bit
          - os: macos-latest
            cmd: dist:mac
            name: macOS
          - os: ubuntu-latest
            cmd: dist:linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Programmi-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # TRITAPROJECT (cartella tritaproject/): lettore ed elaboratore di progetti, Windows 10/11 64 bit e Windows 7 32 bit
  tritaproject:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tritaproject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tritaproject/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # versione per Windows 7 a 32 bit (Electron 22), come gli altri programmi
      - run: npm run dist:win7
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TRITAPROJECT-Windows
          path: tritaproject/dist/*.exe
          if-no-files-found: error
      # Release dedicata (tag tritaproject-v<versione>), separata da quella degli altri programmi
      - id: v
        if: github.event_name == 'push'
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: tritaproject-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TRITAPROJECT ${{ steps.v.outputs.version }}
          make_latest: false
          files: tritaproject/dist/*.exe
          body: |
            **TRITAPROJECT**: lettore ed elaboratore di progetti (PDF/DXF → domande, relazioni, tavole PDF e DXF, modello 3D).

            | PC | File |
            |---|---|
            | Windows 7 / 8 (anche 32 bit) | `TRITAPROJECT-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` (o `-portable.exe`, senza installazione) |
            | Windows 10 / 11 a 64 bit | `TRITAPROJECT-${{ steps.v.outputs.version }}-setup.exe` (o `-portable.exe`) |

            Al primo avvio Windows può mostrare un avviso: «Ulteriori informazioni» → «Esegui comunque».
            Serve una chiave API di Claude (console.anthropic.com), da inserire in ⚙ Impostazioni. Guida: `tritaproject/README.md`.

  # Pagina di download: una Release con i programmi per Windows, aggiornata a ogni versione
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Programmi-Windows*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CONTROLLO_SISTEM e INSERT_SISTEM ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            out/*.exe
            guida/Manuale_CONTROLLO_SISTEM.pdf
            guida/Guida_Amministratore.pdf
            guida/Guida_Dipendenti.pdf
            guida/Guida_Amministratore.html
            guida/Guida_Dipendenti.html
          body: |
            **Guide** (qui sotto, in Assets): `Guida_Amministratore.pdf` / `.html` per l'amministrazione e il server, `Guida_Dipendenti.pdf` / `.html` per i dipendenti, `Manuale_CONTROLLO_SISTEM.pdf` completo.

            **Quale file scaricare**

            | PC | Programma | File |
            |---|---|---|
            | Amministratore (Windows 7 32 bit) | CONTROLLO_SISTEM | `CONTROLLO_SISTEM-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` |
            | Dipendenti (qualsiasi Windows) | INSERT_SISTEM | `INSERT_SISTEM-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` |

            I file *Windows7-32bit* funzionano su Windows 7, 8, 10 e 11. Le versioni *portable* partono senza installazione; quelle senza «Windows7» sono per Windows 10/11 a 64 bit.
            Al primo avvio Windows può mostrare un avviso: «Ulteriori informazioni» → «Esegui comunque».
