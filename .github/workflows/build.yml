name: Build eseguibili

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Una nuova spinta annulla la compilazione precedente ancora in corso
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            name: Windows
          - os: windows-latest
            cmd: dist:win7
            name: Windows7-32bit
          - os: macos-latest
            cmd: dist:mac
            name: macOS
          - os: ubuntu-latest
            cmd: dist:linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ESPROPRI_SISTEM: prove automatiche e controllo che Espropri.html sia stato ricompilato dai sorgenti
      - if: matrix.os == 'ubuntu-latest'
        run: npm test && npm run build:espropri && git diff --exit-code -- Espropri.html guida/
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Programmi-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # Pagina di download di ESPROPRI_SISTEM: release separata (tag espropri-v…) con i soli file di questo programma,
  # così non tocca le release degli altri programmi della suite e non diventa la release principale.
  # Pubblica anche se manca il Mac (runner macOS a volte non disponibile): servono solo i file Windows,
  # e se mancano la pubblicazione si ferma (fail_on_unmatched_files).
  release:
    needs: build
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: Programmi-Windows*
          merge-multiple: true
      # Guide in PDF dalle pagine HTML (Chrome è già installato sul runner)
      - name: Guide in PDF
        run: |
          for f in Guida_Processi_Espropri Normativa_Espropri; do
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="$PWD/guida/$f.pdf" "file://$PWD/guida/$f.html"
            test -s "guida/$f.pdf"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: espropri-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ESPROPRI_SISTEM ${{ steps.v.outputs.version }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            out/ESPROPRI_SISTEM-*.exe
            guida/Guida_Processi_Espropri.pdf
            guida/Guida_Processi_Espropri.html
            guida/Normativa_Espropri.pdf
            guida/Normativa_Espropri.html
          body: |
            **ESPROPRI_SISTEM** – gestione delle procedure di esproprio, asservimento e occupazione temporanea (D.P.R. 327/2001).

            | PC | File |
            |---|---|
            | Windows 10/11 (64 bit) | `ESPROPRI_SISTEM-${{ steps.v.outputs.version }}-setup.exe` (installazione) o `…-portable.exe` (senza installare) |
            | Windows 7/8 o 32 bit | `ESPROPRI_SISTEM-${{ steps.v.outputs.version }}-Windows7-32bit-setup.exe` o `…-portable.exe` |

            Al primo avvio Windows può mostrare un avviso: «Ulteriori informazioni» → «Esegui comunque».
            I dati si salvano in `Documenti\ESPROPRI_SISTEM`; i fascicoli delle pratiche in `Documenti\ESPROPRI_SISTEM\Pratiche` (cartella modificabile).
            Per leggere i DWG installare il convertitore gratuito «ODA File Converter»; in alternativa salvare il disegno come DXF.
            **Guida dei processi** di questa versione (percorsi art. 20, 22, 22-bis, 42-bis, 49 e cessione, passi, termini, documenti): `Guida_Processi_Espropri.pdf` o `.html`.
            **Studio della normativa**: `Normativa_Espropri.pdf` o `.html`.
