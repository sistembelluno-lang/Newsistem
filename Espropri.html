:root{--bg:#eef2f8;--card:#fff;--tx:#0f1b2d;--mu:#5d6b82;--bd:#dfe5ef;--ac:#2457d6;--ok:#13804f;--ko:#c2372b;--hd:#f3f6fb;

  const reSoc = /\b(s\.?\s?r\.?\s?l|s\.?\s?p\.?\s?a|s\.?\s?a\.?\s?s|s\.?\s?n\.?\s?c|s\.?\s?s|soc(?:ieta)?|societa|coop|consorzio|comune|provincia|regione|demanio|ente|azienda|fondazione|associazione|parrocchia|diocesi|banca|istituto|universita|agenzia|stato|ministero|ferrovie|anas|enel|condominio|immobiliare|srls|stp|cooperativa)\b/i;
  C.giuridica = o => /^\d{11}$/.test(String(o.cf || '').trim()) || reSoc.test(U.norm(o.nome)) || !!o.sede;
  C.sesso = o => o.sesso || (C.giuridica(o) ? 'G' : C.sessoCF(o.cf) || '');
  C.saluto = o => ({ M: 'Egr. Sig.', F: 'Gent.ma Sig.ra', G: 'Spett.le' }[C.sesso(o)] || 'Gent.mo/a Sig./Sig.ra');
  C.gentile = o => ({ M: 'Gentile Signore', F: 'Gentile Signora', G: 'Spettabile Ditta' }[C.sesso(o)] || 'Gentile Signore/a');
  C.nato = o => ({ M: 'nato', F: 'nata' }[C.sesso(o)] || 'nato/a');
  // «ROSSI MARIO nato a BELLUNO (BL) il 01/02/1950 - CF: RSS…» oppure «ACME SRL con sede in FELTRE (BL) - CF: 0123…»
  C.anagrafica = o => {
    let s = o.nome || '';
    if (C.giuridica(o) && (o.sede || o.natoA)) s += ' con sede in ' + (o.sede || o.natoA);
    else if (o.natoA || o.natoIl) s += ' ' + C.nato(o) + (o.natoA ? ' a ' + o.natoA : '') + (o.natoIl ? ' il ' + U.dataIt(o.natoIl) : '');
    if (o.cf) s += ' - CF: ' + o.cf;
    return s;
  };
  C.diritto = o => [o.titolo || '', o.quota || ''].filter(Boolean).join(' ').trim();
  C.indirizzo = o => [o.via, [o.cap, o.citta, o.prov ? '(' + o.prov + ')' : ''].filter(Boolean).join(' ')].filter(Boolean).join(', ');

  // Controllo formale: carattere di controllo del codice fiscale (16 caratteri) o della partita IVA (11 cifre)
  C.cfValido = cf => {
    cf = String(cf || '').toUpperCase().replace(/\s/g, '');
    if (/^\d{11}$/.test(cf)) {
      let s = 0; for (let i = 0; i < 10; i++) { let n = +cf[i]; if (i % 2) { n *= 2; if (n > 9) n -= 9; } s += n; }
      return (10 - s % 10) % 10 === +cf[10];
    }
    if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-EHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf)) return false;
    const DISP = [1, 0, 5, 7, 9, 13, 15, 17, 19, 21, 2, 4, 18, 20, 11, 3, 6, 8, 12, 14, 16, 10, 22, 25, 24, 23];
    let s = 0;
    for (let i = 0; i < 15; i++) {
      const c = cf[i], v = /\d/.test(c) ? +c : c.charCodeAt(0) - 65;
      s += i % 2 ? v : DISP[v];
    }
    return String.fromCharCode(65 + s % 26) === cf[15];
  };

  // Controlli di una ditta: dati mancanti o incoerenti da completare a mano.
  // livello: 'errore' (da correggere), 'manca' (da completare), 'info'
  C.controlli = (d, parts) => {
    const L = [], I = d.intest || [];
    if (!I.length) L.push({ livello: 'errore', msg: 'Nessun intestatario' });
    I.forEach(o => {
      const nome = o.nome || '(senza nome)';
      if (!o.nome) L.push({ livello: 'errore', msg: 'Intestatario senza nome' });
      if (!o.cf) L.push({ livello: 'manca', msg: `Manca il codice fiscale di ${nome}`, campo: 'cf', o });
      else if (!C.cfValido(o.cf)) L.push({ livello: 'errore', msg: `Codice fiscale non valido per ${nome}: ${o.cf}`, campo: 'cf', o });
      if (!o.via && !o.pec) L.push({ livello: 'info', msg: `Manca l'indirizzo di ${nome} (serve per le lettere)`, campo: 'via', o });
      if (!o.titolo && !o.quota) L.push({ livello: 'info', msg: `Manca il diritto e la quota di ${nome}` });
    });
    // Le quote dello stesso diritto devono sommare a 1 (proprietà; nuda proprietà e usufrutto si contano a parte)
    const gruppi = {};
    I.forEach(o => { if (!o.quota) return; const t = /nuda/i.test(o.titolo) ? 'nuda proprietà' : /usufr/i.test(o.titolo) ? 'usufrutto' : /propr/i.test(o.titolo) || !o.titolo ? 'proprietà' : null; if (t) gruppi[t] = (gruppi[t] || 0) + U.quota(o.quota); });
    Object.entries(gruppi).forEach(([t, q]) => { if (Math.abs(q - 1) > 1e-6) L.push({ livello: 'errore', msg: `Le quote di ${t} sommano a ${Math.round(q * 1e4) / 1e4} invece di 1` }); });
    if (parts && !parts.length) L.push({ livello: 'errore', msg: 'Ditta senza particelle' });
    return L;
  };

  // ---- Intestatari da testo libero ----
  const reTit = /(nuda\s+propriet\w*'?|propriet\w*'?\s*superficiaria|propriet\w*'?|usufrutt\w*(?:\s+parziale)?|comproprie\w*|enfiteu\w*|livell\w*|diritto\s+del\s+concedente|diritto\s+di\s+superficie|superficie|uso|abitazione|oneri|servit\w*|concedente)(?:\s*:)?(?:\s+per)?\s*(\d+\s*\/\s*\d+)?/i;
  const inizioRiga = /^(nat[oa]|n\.|c\.?\s?f|cod|con\s+sede|sede|residente|res\.|via\b|propriet|nuda|usufrutt|compropr|enfiteu|livell|diritto|quota|\d+\s*\/\s*\d+)/i;

  C.leggiIntestatario = seg => {
    let s = String(seg || '').replace(/\s+/g, ' ').trim().replace(/^[-–•·,;]+\s*/, '');
    if (!s) return null;
    const o = { nome: '', natoA: '', natoIl: '', cf: '', sede: '', titolo: '', quota: '' };
    const mcf = C.reCF.exec(s);
    if (mcf) o.cf = (mcf[1] || mcf[2]).toUpperCase();
    let m = /\b(nat[oa])\s+a\s+(.+?)\s+il\s+(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i.exec(s);
    if (m) { o.natoA = m[2].trim(); o.natoIl = U.parseData(m[3]); if (m[1].toLowerCase() === 'nata') o.sesso = 'F'; }
    else if ((m = /\bcon\s+sede\s+(?:in|a)\s+(.+?)(?=\s*[-–,;]?\s*(?:c\.?\s?f\.?|cod|p\.?\s?iva|\d{11}|$))/i.exec(s))) o.sede = m[1].trim();
    // Diritto e quota: di solito dopo il codice fiscale
    const dopo = mcf ? s.slice(mcf.index + mcf[0].length) : s;
    const mt = reTit.exec(dopo) || reTit.exec(s.replace(/^.*?(?=propriet|nuda|usufrutt|compropr|enfiteu|livell|diritto)/i, ''));
    if (mt) { o.titolo = mt[1].replace(/\s+/g, ' ').trim(); o.quota = (mt[2] || '').replace(/\s/g, ''); }
    if (!o.quota) { const mq = /(\d+\s*\/\s*\d+)\s*$/.exec(s); if (mq) o.quota = mq[1].replace(/\s/g, ''); }
    // Nome: quello che sta prima di nato/sede/CF/diritto
    const fine = [/\s+nat[oa]\s+a\s+/i, /\s+con\s+sede\s+/i, /\s*[-–,]?\s*c\.?\s?f\.?\s*:?\s*/i, /\s*[-–,]?\s*cod(?:ice)?\.?\s*fisc/i, C.reCF, /\s+(?:propriet|nuda\s+propr|usufrutt|compropr|enfiteu|livell)/i]
      .map(r => { const x = r.exec(s); return x ? x.index : -1; }).filter(i => i > 0);
    o.nome = (fine.length ? s.slice(0, Math.min(...fine)) : s).replace(/[-–,;:]+$/, '').trim();
    if (!o.nome && !o.cf) return null;
    return o;
  };

  // Più intestatari nello stesso testo: separati da «;», oppure uno per blocco di righe, oppure più codici fiscali di fila
  C.leggiIntestatari = testo => {
    const t = String(testo || '').replace(/\r/g, '').trim();
    if (!t) return [];
    let seg;
    if (/;/.test(t)) seg = t.split(/;/);
    else if (/\n/.test(t)) {
      seg = [];
      t.split('\n').map(x => x.trim()).filter(Boolean).forEach(r => {
        if (!seg.length || !inizioRiga.test(r)) seg.push(r); else seg[seg.length - 1] += ' ' + r;
      });
    } else seg = [t];
    const out = [];
    seg.forEach(s => {
      const cfs = []; const re = new RegExp(C.reCF.source, 'gi'); let m;
      while ((m = re.exec(s))) cfs.push(m.index + m[0].length);
      if (cfs.length > 1) {
        // Spezza dopo ogni codice fiscale (più l'eventuale diritto e quota che lo seguono)
        let start = 0;
        cfs.forEach((end, i) => {
          let e = end; const rest = s.slice(end), mt = /^\s*[-–,]?\s*/.exec(rest), r2 = rest.slice(mt[0].length), md = reTit.exec(r2);
          if (md && md.index === 0) e = end + mt[0].length + md[0].length;
          if (i === cfs.length - 1) e = s.length;
          out.push(s.slice(start, e)); start = e;
        });
      } else out.push(s);
    });
    return out.map(C.leggiIntestatario).filter(Boolean);
  };

  // ---- Importazione tabella ditte/particelle ----
  C.CAMPI = {
    nditta: ['n ditta', 'ditta n', 'numero ditta', 'nr ditta', 'n piano', 'n p', 'np', 'num piano', 'numero piano', 'n ord', 'n ordine', 'progressivo', 'unita negoziale', 'n'],
    espr: ['~esprop', '~espr', 'area espr', '~acquisiz'],
    servop: ['~ingombro', '~sedime', '~servitu opere', '~asservimento opere'],
    serv: ['~servitu', '~asserv', 'area serv'],
    occ: ['~occupaz', '~occ temp', 'area occup', '~occupazione'],
    natoAIl: ['nato a il', 'nato a e il', 'nata a il', 'luogo e data di nascita', 'nascita'],
    natoA: ['nato a', 'nata a', 'luogo di nascita', 'luogo nascita', 'comune di nascita', 'nato'],
    natoIl: ['nato il', 'nata il', 'data di nascita', 'data nascita', 'il'],
    intest: ['intestatari', 'intestatario', 'intestazione', 'ditta catastale', 'ditte catastali', 'proprietari', 'proprietario', 'nominativo', 'nome e cognome', 'cognome e nome', 'denominazione', 'ragione sociale', 'ditta'],
    comune: ['comune catastale', 'comune', 'comune censuario'],
    sez: ['sezione', 'sez'],
    fg: ['foglio', 'fg', 'f', 'fgl'],
    nuovo: ['nuovo mappale', 'mappale derivato', 'mappale nuovo', 'mapp nuovo', 'derivato'],
    ex: ['ex mappale', 'mappale originario', 'ex', 'originario', 'mappale origine'],
    map: ['mappale', 'particella', 'mapp', 'map', 'p lla', 'part', 'numero', 'num'],
    sub: ['subalterno', 'sub'],
    ct: ['catasto', 'tipo catasto'],
    qual: ['qualita classe', 'qualita', 'coltura', 'qualita coltura', 'categoria', 'qual'],
    cls: ['classe', 'cl'],
    ha: ['ha', 'ettari'], are: ['are'], ca: ['ca', 'centiare'],
    sup: ['superficie catastale', 'sup catastale', 'superficie totale', 'superficie', 'sup', 'consistenza', 'mq'],
    rd: ['reddito dominicale', 'reddito domenicale', 'r d', 'rd', 'dominicale', 'domenicale'],
    ra: ['reddito agrario', 'r a', 'ra', 'agrario'],
    zona: ['destinazione urbanistica', 'destinazione', 'zona', 'zto', 'z t o', 'pi', 'prg'],
    cognome: ['cognome'], nome: ['nome'],
    cf: ['codice fiscale', 'cf', 'c f', 'cod fisc', 'partita iva', 'p iva', 'cf piva'],
    titolo: ['diritto reale', 'diritti e oneri reali', 'titolo', 'diritto', 'titolarita', 'proprieta'],
    quota: ['quota', 'quote'],
    via: ['indirizzo', 'via', 'residenza', 'domicilio', 'recapito'],
    cap: ['cap'],
    citta: ['citta', 'comune di residenza', 'comune residenza', 'localita', 'residente a', 'residente'],
    prov: ['provincia', 'prov'],
    pec: ['pec', 'email', 'e mail', 'mail', 'posta elettronica'],
    note: ['note', 'annotazioni']
  };

  // righe → {particelle:[…], ditte:[…], avvisi:[]}. Le ditte hanno n (numero di piano) e intest; le particelle il riferimento nd.
  C.importaTabella = function (righe, opt = {}) {
    const avvisi = [];
    const mp = ES.tab.mappa(righe, C.CAMPI), M = mp.map;
    if (M.map == null && M.intest == null && M.cognome == null) throw new Error('Nella tabella non trovo né la colonna del mappale né quella degli intestatari: controlla le intestazioni');
    const get = (r, k) => (M[k] != null ? r[M[k]] : '');
    const str = v => String(v ?? '').trim();
    righe = righe.map(r => r.slice());
    // «Ditta» può essere il numero di ditta o il nome degli intestatari: si decide dal contenuto
    if (M.intest != null && M.nditta == null) {
      const vals = righe.slice(mp.riga + 1).map(r => str(r[M.intest])).filter(Boolean);
      if (vals.length && vals.filter(v => /^\d{1,4}$/.test(v)).length / vals.length > 0.8) { M.nditta = M.intest; delete M.intest; }
    }
    const part = new Map(), ditteN = new Map(), ownersOf = new Map();
    // Formato a blocchi (riepilogo delle visure): il numero di ditta solo sulla prima riga del blocco, gli intestatari
    // scritti riga per riga sotto («NOME con sede in …», «CF: …», «Proprieta': 1/1») e le particelle nelle stesse righe.
    // Il numero scende alle righe successive e gli intestatari si leggono tutti insieme per blocco.
    const testaBlocco = /^\s*(c\.?\s?f\b|cod\w*\s+fisc|propriet|nuda|usufrutt|compropr|enfiteu|livell|diritto|nat[oa]\s)/i;
    if (M.nditta != null && M.intest != null && righe.slice(mp.riga + 1).some(r => !str(r[M.nditta]) && testaBlocco.test(str(r[M.intest])))) {
      let cur = '';
      righe.slice(mp.riga + 1).forEach(r => {
        const v = str(r[M.nditta]).replace(/^(ditta|np|n\.?)\s*/i, '');
        if (v) cur = v; else if (cur) r[M.nditta] = cur;
        const t = str(r[M.intest]);
        if (t && cur) { const L = ownersOf.get(cur + '\u0000t'); ownersOf.set(cur + '\u0000t', (L ? L + '\n' : '') + t); }
        r[M.intest] = '';
      });
      [...ownersOf.keys()].forEach(k => { ownersOf.set(k.slice(0, -2), C.leggiIntestatari(ownersOf.get(k))); ownersOf.delete(k); });
    }
    let ultima = null;
    righe.slice(mp.riga + 1).forEach((r, ir) => {
      let mapp = str(get(r, 'map')), ex = str(get(r, 'ex')), nuovo = str(get(r, 'nuovo'));
      // «1706 ex 1367»: nuovo mappale 1706 derivato dal 1367
      let m = /^(\S+)\s*(?:\(?\s*ex\s*\.?\s*)(\S+?)\)?$/i.exec(mapp);
      if (m) { nuovo = nuovo || m[1]; mapp = m[2]; }
      if (ex && !nuovo) { nuovo = mapp; mapp = ex; }
      const nd = str(get(r, 'nditta')).replace(/^(ditta|np|n\.?)\s*/i, '');
      let fg = str(get(r, 'fg')) || opt.fg || '';
      // Righe senza mappale ma con un intestatario: continuano la particella o la ditta precedente
      let p = null;
      if (mapp) {
        const sub = str(get(r, 'sub'));
        const k = ES.analisi.chiave(fg, mapp, sub);
        p = part.get(k);
        if (!p) {
          p = { id: U.id(), ct: /f|urb/i.test(str(get(r, 'ct'))) ? 'F' : 'T', comune: str(get(r, 'comune')) || opt.comune || '', sez: str(get(r, 'sez')), fg, map: mapp, sub, nuovo: {}, qual: '', cls: '', sup: 0, rd: '', ra: '', zona: '', man: {}, nd: '', intest: [], note: '' };
          part.set(k, p);
        }
        const q = str(get(r, 'qual')), c = str(get(r, 'cls'));
        if (q && !p.qual) { const mq = /^(.*?)\s*\/\s*(\w*)$/.exec(q); if (mq && !c) { p.qual = mq[1]; p.cls = mq[2]; } else p.qual = q; }
        if (c && !p.cls) p.cls = c;
        let sup = 0;
        if (M.ha != null || M.are != null || M.ca != null) sup = U.fromHaAreCa(get(r, 'ha'), get(r, 'are'), get(r, 'ca'));
        const sv = get(r, 'sup');
        if (!sup && sv !== '') { const mh = /^(\d+)\.(\d{2})\.(\d{2})$/.exec(str(sv)); sup = mh ? U.fromHaAreCa(mh[1], mh[2], mh[3]) : U.num(sv); }
        if (sup && !p.sup) p.sup = sup;
        ['rd', 'ra', 'zona', 'note'].forEach(f => { const v = str(get(r, f)); if (v && !p[f]) p[f] = v; });
        ['espr', 'servop', 'serv', 'occ'].forEach(t => { const v = get(r, t); if (str(v) !== '' && U.num(v)) p.man[t] = U.num(v); });
        if (nuovo) { const t = ['espr', 'servop', 'serv', 'occ'].find(x => p.man[x]) || 'espr'; p.nuovo[t] = nuovo; }
        if (nd) p.nd = nd;
        ultima = p;
      } else if (!nd && ultima) p = ultima;
      // Intestatari della riga
      let L = [];
      const it = str(get(r, 'intest'));
      if (it) L = C.leggiIntestatari(it);
      if (!L.length && (str(get(r, 'cognome')) || str(get(r, 'nome')) || str(get(r, 'cf')))) {
        L = [{ nome: [str(get(r, 'cognome')), str(get(r, 'nome'))].filter(Boolean).join(' '), cf: str(get(r, 'cf')).toUpperCase() }];
      }
      if (L.length === 1) {
        const o = L[0];
        const nai = str(get(r, 'natoAIl'));
        if (nai) { const mm = /(?:nat[oa]\s+)?a?\s*(.+?)\s+(?:il\s+)?(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i.exec(nai); if (mm) { o.natoA = o.natoA || mm[1].replace(/^a\s+/i, ''); o.natoIl = o.natoIl || U.parseData(mm[2]); } }
        if (str(get(r, 'natoA'))) o.natoA = str(get(r, 'natoA'));
        if (get(r, 'natoIl') !== '') o.natoIl = U.parseData(get(r, 'natoIl')) || o.natoIl;
        if (str(get(r, 'cf'))) o.cf = str(get(r, 'cf')).toUpperCase();
        if (str(get(r, 'titolo'))) { const t = str(get(r, 'titolo')), mq = /(\d+\s*\/\s*\d+)/.exec(t); o.titolo = t.replace(/(\d+\s*\/\s*\d+)/, '').trim(); if (mq && !o.quota) o.quota = mq[1].replace(/\s/g, ''); }
        if (str(get(r, 'quota'))) o.quota = str(get(r, 'quota'));
        ['via', 'cap', 'citta', 'prov', 'pec'].forEach(f => { const v = str(get(r, f)); if (v) o[f] = v; });
      }
      if (!L.length) return;
      const dest = p ? p.intest : (nd ? (ownersOf.get(nd) || ownersOf.set(nd, []).get(nd)) : null);
      if (!dest) { avvisi.push(`Riga ${mp.riga + ir + 2}: intestatario senza particella né numero di ditta, ignorato`); return; }
      L.forEach(o => {
        // Stessa persona con diritti o quote diversi (es. usufrutto 1/2 e nuda proprietà 1/2) resta su due righe
        const chiave = x => (x.cf || U.norm(x.nome)) + '~' + U.norm(x.titolo) + '~' + String(x.quota || '').replace(/\s/g, '');
        const k = chiave(o);
        const g = dest.find(x => chiave(x) === k);
        if (g) Object.keys(o).forEach(f => { if (o[f] && !g[f]) g[f] = o[f]; }); else dest.push(o);
      });
      if (p && nd) ditteN.set(nd, true);
    });
    // Intestatari indicati solo per ditta: valgono per tutte le particelle della ditta
    const P = [...part.values()];
    ownersOf.forEach((L, nd) => P.filter(p => p.nd === nd && !p.intest.length).forEach(p => { p.intest = U.clone(L); }));
    // Righe della stessa ditta senza intestatari ripetuti: prendono quelli di un'altra particella con lo stesso numero
    P.filter(p => p.nd && !p.intest.length).forEach(p => { const q = P.find(x => x.nd === p.nd && x.intest.length); if (q) p.intest = U.clone(q.intest); });
    const res = C.raggruppa(P, avvisi);
    P.forEach(p => { if (!p.intest.length) avvisi.push(`Fg.${p.fg} mapp.${p.map}: nessun intestatario`); delete p.intest; });
    return { particelle: P, ditte: res, avvisi, colonne: M, rigaIntestazione: mp.riga };
  };

  // Firma della ditta: stessi intestatari con stessi diritti e stesse quote catastali.
  // ROSSI 500/1000 + VERDI 500/1000 è una ditta; ROSSI 100/1000 + VERDI 900/1000 è un'altra ditta.
  // Le quote si confrontano come frazioni (500/1000 = 1/2); i diritti diversi (proprietà, nuda proprietà, usufrutto) separano.
  const quotaK = q => { const s = String(q || '').trim(); if (!s) return ''; const m = /(\d+)\s*\/\s*(\d+)/.exec(s); return m && +m[2] ? (Math.round(+m[1] / +m[2] * 1e6) / 1e6).toString() : U.norm(s); };
  const titoloK = t => { const n = U.norm(t); return /nuda/.test(n) ? 'nuda' : /usufr/.test(n) ? 'usufrutto' : /propr/.test(n) ? 'proprieta' : n; };
  C.firma = L => L.map(o => (o.cf ? o.cf.toUpperCase() : U.norm(o.nome)) + '~' + titoloK(o.titolo) + '~' + quotaK(o.quota)).sort().join('|');

  // Particelle (con intest e nd) → ditte; le particelle ricevono p.ditta = id.
  // La ditta nasce sempre dagli intestatari; il numero di ditta del file serve come numero di piano.
  C.raggruppa = (P, avvisi) => {
    avvisi = avvisi || [];
    const per = new Map();
    P.forEach(p => {

// Tavola grafica del piano particellare in SVG: particelle catastali, aree d'intervento con retini, numeri di particella,
// numero di piano (ditta) sulle aree, legenda, scala grafica, nord, quadro d'unione e cartiglio.
// Coordinate del disegno in metri; sulla carta si lavora in millimetri alla scala scelta.
(function (ES) {
  'use strict';
  const T = ES.tavola = {}, G = ES.geo, U = ES.U;

  T.STILI = {
    espr: { nome: 'Area da espropriare', col: '#d62828', fill: 'rgba(214,40,40,.28)', pat: 'p-espr' },
    servop: { nome: 'Servitù – ingombro opere', col: '#7b2cbf', fill: 'rgba(123,44,191,.28)', pat: 'p-servop' },
    serv: { nome: 'Area da asservire', col: '#1d70b8', fill: 'rgba(29,112,184,.22)', pat: 'p-serv' },
    occ: { nome: 'Area da occupare temporaneamente', col: '#e09f00', fill: 'rgba(240,180,0,.30)', pat: 'p-occ' }
  };
  T.FORMATI = { A4: [210, 297], A3: [297, 420], A2: [420, 594], A1: [594, 841], A0: [841, 1189] };
  T.SCALE = [200, 500, 1000, 2000, 2500, 5000, 10000];

  const defs = () => `<defs>
<pattern id="p-espr" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)"><rect width="2" height="2" fill="rgba(214,40,40,.22)"/><line x1="0" y1="0" x2="0" y2="2" stroke="#d62828" stroke-width=".35"/></pattern>
<pattern id="p-servop" patternUnits="userSpaceOnUse" width="2" height="2"><rect width="2" height="2" fill="rgba(123,44,191,.20)"/><path d="M0 0L2 2M2 0L0 2" stroke="#7b2cbf" stroke-width=".25"/></pattern>
<pattern id="p-serv" patternUnits="userSpaceOnUse" width="2.4" height="2.4" patternTransform="rotate(-45)"><rect width="2.4" height="2.4" fill="rgba(29,112,184,.16)"/><line x1="0" y1="0" x2="0" y2="2.4" stroke="#1d70b8" stroke-width=".3"/></pattern>
<pattern id="p-occ" patternUnits="userSpaceOnUse" width="2.2" height="2.2"><rect width="2.2" height="2.2" fill="rgba(240,180,0,.26)"/><circle cx="1.1" cy="1.1" r=".35" fill="#c98a00"/></pattern>
</defs>`;

  // Trasformazione mondo → carta (mm) per una finestra [x0,y0,x1,y1] disegnata in un riquadro {x,y,w,h} a scala 1:s
  const trasf = (fin, box, s) => {
    const k = 1000 / s, cx = (fin[0] + fin[2]) / 2, cy = (fin[1] + fin[3]) / 2;
    return { k, f: (x, y) => [box.x + box.w / 2 + (x - cx) * k, box.y + box.h / 2 - (y - cy) * k] };
  };
  const pathMP = (M, f) => M.map(P => P.map(r => 'M' + r.map(p => { const q = f(p[0], p[1]); return q[0].toFixed(2) + ' ' + q[1].toFixed(2); }).join('L') + 'Z').join('')).join('');
  const pathPts = (pts, chiusa, f) => 'M' + pts.map(p => { const q = f(p[0], p[1]); return q[0].toFixed(2) + ' ' + q[1].toFixed(2); }).join('L') + (chiusa ? 'Z' : '');

  // Scala standard che fa stare la finestra nel riquadro
  T.scalaAdatta = (bb, box, minima = 200) => {
    const w = Math.max(1, bb[2] - bb[0]), h = Math.max(1, bb[3] - bb[1]);
    const s = Math.max(w / box.w, h / box.h) * 1000 * 1.08;
    return T.SCALE.find(x => x >= s && x >= minima) || Math.ceil(s / 1000) * 1000;
  };

  // Il disegno della mappa (senza cornice) dentro un riquadro
  function mappa(pr, calc, box, fin, s, opt) {
    const geo = pr.geo; if (!geo) return '';
    const { k, f } = trasf(fin, box, s);
    const cx = (fin[0] + fin[2]) / 2, cy = (fin[1] + fin[3]) / 2, hw = box.w / 2 / k, hh = box.h / 2 / k;
    const vista = [cx - hw, cy - hh, cx + hw, cy + hh];
    const dentro = M => G.bboxOverlap(G.bboxMP(M), vista);
    const partDitta = new Map((pr.particelle || []).map(p => [ES.analisi.chiave(p.fg, p.map, p.sub), p]));
    const dittaDi = kk => { const p = partDitta.get(kk) || partDitta.get(String(kk).split('|').slice(0, 2).join('|')); return p ? (pr.ditte || []).find(d => d.id === p.ditta) : null; };
    const id = 'c' + Math.random().toString(36).slice(2, 7);
    let o = `<clipPath id="${id}"><rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}"/></clipPath><g clip-path="url(#${id})">`;
    o += `<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" fill="#fff"/>`;
    // Sfondo
    (geo.sfondo || []).forEach(l => { if (G.bboxOverlap(G.bboxPts(l.pts), vista)) o += `<path d="${pathPts(l.pts, l.chiusa, f)}" fill="none" stroke="#9aa3ad" stroke-width=".18"/>`; });
    // Aree d'intervento
    const sel = opt.ditta || null;
    ['occ', 'serv', 'servop', 'espr'].forEach(t => (geo.pezzi || []).filter(p => p.tipo === t && dentro(p.mp)).forEach(p => {
      const d = p.k ? dittaDi(p.k) : null, altra = sel && (!d || d.id !== sel);
      const st = T.STILI[t];
      o += `<path d="${pathMP(p.mp, f)}" fill="${altra ? 'none' : 'url(#' + st.pat + ')'}" fill-rule="evenodd" stroke="${st.col}" stroke-width="${altra ? .15 : .3}" ${altra ? 'stroke-dasharray="1 .8"' : ''} data-pezzo="${p.id}" data-k="${p.k || ''}"/>`;
    }));
    // Particelle catastali
    (geo.part || []).forEach(p => { if (dentro(p.mp)) o += `<path d="${pathMP(p.mp, f)}" fill="none" stroke="#222" stroke-width=".2" data-k="${p.k || ''}" class="tv-part"/>`; });
    // Numeri di particella: testi del DXF, altrimenti al centro del poligono
    const g = opt.seg || 1, hTxt = (opt.hTesto || 2.2) * g, scritti = new Set();
    (geo.part || []).forEach(p => {
      if (!p.k || !dentro(p.mp) || scritti.has(p.k)) return;
      const lp = G.puntoEtichettaMP(p.mp); if (!lp) return;
      const area = G.areaMP(p.mp) * k * k; if (area < 6 * g * g) return;
      scritti.add(p.k);
      const q = f(lp[0], lp[1]);
      o += `<text x="${q[0].toFixed(2)}" y="${q[1].toFixed(2)}" font-size="${hTxt}" text-anchor="middle" dominant-baseline="middle" fill="#111" font-family="Arial">${U.esc(p.map)}</text>`;
    });
    if (!(geo.part || []).length) (geo.etich || []).forEach(t => { const q = f(t.x, t.y); if (q[0] > box.x && q[0] < box.x + box.w && q[1] > box.y && q[1] < box.y + box.h) o += `<text x="${q[0].toFixed(2)}" y="${q[1].toFixed(2)}" font-size="${hTxt}" fill="#111" font-family="Arial">${U.esc(t.t)}</text>`; });
    // Numero di piano: un cerchio per ditta e gruppo di aree vicine
    const perDitta = new Map();
    (geo.pezzi || []).forEach(p => { const d = p.k ? dittaDi(p.k) : null; if (!d || !dentro(p.mp) || (sel && d.id !== sel)) return; (perDitta.get(d.id) || perDitta.set(d.id, { d, pz: [] }).get(d.id)).pz.push(p); });
    perDitta.forEach(({ d, pz }) => {
      const grande = pz.slice().sort((a, b) => b.a - a.a)[0];
      const lp = G.puntoEtichettaMP(grande.mp); if (!lp) return;
      const q = f(lp[0], lp[1]), r = Math.max(2.2, String(d.n).length * 1.3) * g;
      const ox = q[0] + r * 1.6, oy = q[1] - r * 1.6;
      o += `<line x1="${q[0].toFixed(2)}" y1="${q[1].toFixed(2)}" x2="${ox.toFixed(2)}" y2="${oy.toFixed(2)}" stroke="#d62828" stroke-width="${.25 * g}"/><circle cx="${ox.toFixed(2)}" cy="${oy.toFixed(2)}" r="${r}" fill="#fff" stroke="#d62828" stroke-width="${.35 * g}"/><text x="${ox.toFixed(2)}" y="${oy.toFixed(2)}" font-size="${r * 1.05}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#d62828" font-family="Arial" data-ditta="${d.id}">${U.esc(d.n)}</text>`;
    });
    o += '</g>';
    return o;
  }

  function legenda(x, y, w, tipi) {
    let o = `<g font-family="Arial"><rect x="${x}" y="${y}" width="${w}" height="${8 + tipi.length * 6 + 6}" fill="#fff" stroke="#222" stroke-width=".25"/><text x="${x + 3}" y="${y + 5}" font-size="3" font-weight="700">LEGENDA</text>`;
    tipi.forEach((t, i) => { const st = T.STILI[t], yy = y + 8 + i * 6; o += `<rect x="${x + 3}" y="${yy}" width="9" height="4.2" fill="url(#${st.pat})" stroke="${st.col}" stroke-width=".3"/><text x="${x + 14}" y="${yy + 3.3}" font-size="2.6">${st.nome}</text>`; });
    const yy = y + 8 + tipi.length * 6;
    o += `<circle cx="${x + 7.5}" cy="${yy + 2.2}" r="2" fill="#fff" stroke="#d62828" stroke-width=".35"/><text x="${x + 7.5}" y="${yy + 2.3}" font-size="2" font-weight="700" fill="#d62828" text-anchor="middle" dominant-baseline="central">N</text><text x="${x + 14}" y="${yy + 3.2}" font-size="2.6">Numero di piano (ditta)</text></g>`;
    return o;
  }
  function scalaGrafica(x, y, s) {
    const passi = [10, 20, 25, 50, 100, 200, 250, 500, 1000], m = passi.find(p => p * 1000 / s >= 8) || 1000, mm = m * 1000 / s;
    let o = `<g font-family="Arial" font-size="2.2">`;
    for (let i = 0; i < 4; i++) o += `<rect x="${x + i * mm}" y="${y}" width="${mm}" height="1.6" fill="${i % 2 ? '#fff' : '#222'}" stroke="#222" stroke-width=".2"/><text x="${x + i * mm}" y="${y + 4.6}" text-anchor="middle">${i * m}</text>`;
    return o + `<text x="${x + 4 * mm}" y="${y + 4.6}" text-anchor="middle">${4 * m} m</text><text x="${x}" y="${y - 1.5}" font-weight="700">Scala 1:${s}</text></g>`;
  }
  const nord = (x, y, h = 12) => `<g><path d="M${x} ${y} L${x + h * .28} ${y + h} L${x} ${y + h * .78} L${x - h * .28} ${y + h} Z" fill="#222"/><text x="${x}" y="${y - 1.2}" font-size="3.4" font-weight="700" text-anchor="middle" font-family="Arial">N</text></g>`;

  function cartiglio(x, y, w, h, c) {
    const r = (yy, t, sz, b) => `<text x="${x + 3}" y="${yy}" font-size="${sz}" ${b ? 'font-weight="700"' : ''} font-family="Arial">${U.esc(t)}</text>`;
    let o = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#222" stroke-width=".35"/>`;
    o += r(y + 5, c.ente || '', 3.2, true) + r(y + 10, c.opera || '', 2.6) + `<line x1="${x}" y1="${y + 13}" x2="${x + w}" y2="${y + 13}" stroke="#222" stroke-width=".25"/>`;
    o += r(y + 19, c.titolo || 'PIANO PARTICELLARE DI ESPROPRIO', 3.4, true) + r(y + 24, c.sotto || '', 2.6);
    o += `<line x1="${x}" y1="${y + h - 8}" x2="${x + w}" y2="${y + h - 8}" stroke="#222" stroke-width=".25"/>` + r(y + h - 3, `Scala 1:${c.scala}   ·   Data ${c.data || U.dataIt(U.oggi())}   ·   ${c.tecnico || ''}`, 2.4);
    return o;
  }

  // Quadro d'unione: tutta l'opera in piccolo con il riquadro della vista
  function keymap(pr, box, vista) {
    const bb = pr.geo.bbox, s = T.scalaAdatta(bb, box, 1) * 1.02;
    const { f } = trasf(bb, box, s);
    let o = `<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" fill="#fff" stroke="#222" stroke-width=".25"/>`;
    (pr.geo.pezzi || []).forEach(p => { o += `<path d="${pathMP(p.mp, f)}" fill="${T.STILI[p.tipo].col}" stroke="none"/>`; });
    const a = f(vista[0], vista[3]), b = f(vista[2], vista[1]);
    o += `<rect x="${a[0].toFixed(2)}" y="${a[1].toFixed(2)}" width="${(b[0] - a[0]).toFixed(2)}" height="${(b[1] - a[1]).toFixed(2)}" fill="none" stroke="#d62828" stroke-width=".4"/><text x="${box.x + 2}" y="${box.y + 4}" font-size="2.6" font-weight="700" font-family="Arial">QUADRO D'UNIONE</text>`;
    return o;
  }

  // Finestra da disegnare: tutte le aree d'intervento (o quelle della ditta), con margine
  T.finestra = (pr, dittaId, margine = 0.15) => {
    const geo = pr.geo; if (!geo) return null;
    let L = geo.pezzi || [];
    if (dittaId) {
      const kd = new Set((pr.particelle || []).filter(p => p.ditta === dittaId).flatMap(p => [ES.analisi.chiave(p.fg, p.map, p.sub), ES.analisi.chiave(p.fg, p.map, '')]));
      L = L.filter(p => kd.has(p.k));
      if (!L.length) { const parts = (geo.part || []).filter(p => kd.has(p.k)); if (parts.length) L = parts; }
    }
    if (!L.length) L = geo.part || [];
    if (!L.length) return geo.bbox;
    const bb = [Infinity, Infinity, -Infinity, -Infinity]; L.forEach(p => G.bboxMP(p.mp, bb));
    const dx = Math.max(10, (bb[2] - bb[0]) * margine), dy = Math.max(10, (bb[3] - bb[1]) * margine);
    return [bb[0] - dx, bb[1] - dy, bb[2] + dx, bb[3] + dy];
  };

  // Tavola completa su un foglio. opt: {formato:'A3', orient:'L'|'P', scala (0 = adatta), ditta, titolo, sotto}
  T.foglio = (pr, calc, opt = {}) => {
    const [a, b] = T.FORMATI[opt.formato || 'A3'] || T.FORMATI.A3;
    const L = (opt.orient || 'L') === 'L', W = L ? b : a, H = L ? a : b, m = 10;
    const latoW = Math.min(85, W * 0.3);
    const box = { x: m, y: m, w: W - 2 * m - latoW - 4, h: H - 2 * m };
    const fin = T.finestra(pr, opt.ditta);
    if (!fin) return '';
    const s = opt.scala || T.scalaAdatta(fin, box);
    const cx = (fin[0] + fin[2]) / 2, cy = (fin[1] + fin[3]) / 2, hw = box.w / 2 * s / 1000, hh = box.h / 2 * s / 1000;
    const tipi = ES.analisi.TIPI.filter(t => (pr.geo.pezzi || []).some(p => p.tipo === t));
    const xl = W - m - latoW;
    let o = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}" font-family="Arial">${defs()}<rect width="${W}" height="${H}" fill="#fff"/>`;
    o += mappa(pr, calc, box, fin, s, opt) + `<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" fill="none" stroke="#222" stroke-width=".5"/>`;
    o += nord(box.x + box.w - 10, box.y + 6);
    const kmH = Math.min(70, H * 0.28);
    o += keymap(pr, { x: xl, y: m, w: latoW, h: kmH }, [cx - hw, cy - hh, cx + hw, cy + hh]);
    o += legenda(xl, m + kmH + 4, latoW, tipi);
    o += scalaGrafica(xl + 4, m + kmH + 4 + 8 + (tipi.length + 1) * 6 + 14, s);
    const ch = 48;
    o += cartiglio(xl, H - m - ch, latoW, ch, { ente: pr.ente && pr.ente.nome, opera: pr.nome, titolo: opt.titolo, sotto: opt.sotto, scala: s, tecnico: pr.ente && pr.ente.tecnico });
    return o + '</svg>';
  };

  // Estratto di mappa per una ditta (allegato alle lettere e allo stato di consistenza): riquadro di 170×200 mm
  T.estratto = (pr, calc, dittaId, scala = 1000, mm = [170, 200]) => {
    const fin = T.finestra(pr, dittaId, 0.25); if (!fin) return '';
    const box = { x: 0, y: 0, w: mm[0], h: mm[1] - 30 };
    let s = scala; const need = T.scalaAdatta(fin, box, 1); if (need > s) s = need;
    const tipi = ES.analisi.TIPI.filter(t => (pr.geo.pezzi || []).some(p => p.tipo === t));
    let o = `<svg xmlns="http://www.w3.org/2000/svg" width="${mm[0]}mm" height="${mm[1]}mm" viewBox="0 0 ${mm[0]} ${mm[1]}" font-family="Arial">${defs()}<rect width="${mm[0]}" height="${mm[1]}" fill="#fff"/>`;
    o += mappa(pr, calc, box, fin, s, { ditta: dittaId }) + `<rect x="0.3" y="0.3" width="${box.w - .6}" height="${box.h - .6}" fill="none" stroke="#222" stroke-width=".4"/>`;
    o += nord(box.w - 8, 5, 10) + `<text x="3" y="5" font-size="3.2" font-weight="700">Estratto mappa catastale – scala 1:${s}</text>`;
    tipi.forEach((t, i) => { const st = T.STILI[t], x = 3, y = box.h + 3 + i * 6.5; o += `<rect x="${x}" y="${y}" width="9" height="4.2" fill="url(#${st.pat})" stroke="${st.col}" stroke-width=".3"/><text x="${x + 11}" y="${y + 3.3}" font-size="2.8">${st.nome}</text>`; });
    o += scalaGrafica(box.w - 64, box.h + 10, s);
    return o + '</svg>';
  };

  // Vista a schermo: tutta la geometria, in coordinate mondo invertite (per pan e zoom nel programma)
  T.schermo = (pr, calc, opt = {}) => {
    const geo = pr.geo; if (!geo) return '';
    const bb = geo.bbox, W = 1000, H = Math.max(200, W * (bb[3] - bb[1]) / Math.max(1, bb[2] - bb[0]));
    const s = Math.max(bb[2] - bb[0], 1) * 1000 / W; // 1 unità = 1 mm a scala s
    const box = { x: 0, y: 0, w: W, h: H };
    return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Arial">${defs()}${mappa(pr, calc, box, bb, s, { ditta: opt.ditta, seg: Math.max(1, W / 450) })}</svg>`, W, H, s };
  };
})(ES);

<ol><li><b>Vincolo preordinato all'esproprio</b> (artt. 9-11): nasce con il piano urbanistico generale o con una variante, oppure con atti che ne hanno l'effetto (conferenza di servizi, accordo di programma, art. 10). Dura <b>5 anni</b>; se non segue la DPU decade (art. 9).</li>

      for (const [i, f] of d.foto.entries()) { const im = box.querySelector(`[data-fi="${i}"]`); im.src = f.data || (f.file ? URL.createObjectURL(new Blob([await APP.FS.leggi(f.file) || new Uint8Array()], { type: 'image/jpeg' })) : ''); }

    };
    disegna();
    m.querySelector('#dfoto').onclick = async () => {
      const L = await APP.scegliFile('image/*', true);
      for (const f of L) {
        const jpg = await riduci(f.buf, f.tipo);

        if (APP.FS.ok) { o.file = APP.FS.dirDitta(p, d) + '/Stato di consistenza/Foto/' + san(f.nome.replace(/\.\w+$/, '')) + '-' + o.id + '.jpg'; await window.desktop.fsScrivi(o.file, jpg); }

  const riduci = (buf, tipo) => new Promise(res => {
    const url = URL.createObjectURL(new Blob([buf], { type: tipo || 'image/jpeg' })), img = new Image();
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); cv.toBlob(async b => res(new Uint8Array(await b.arrayBuffer())), 'image/jpeg', 0.85); };
    img.onerror = () => { URL.revokeObjectURL(url); res(new Uint8Array(buf)); };
    img.src = url;
  });
  // PDF finale: scansione firmata + documentazione fotografica (2 foto per pagina con didascalia «Figura N_Fg. x Mapp. y»)
  async function pdfFinale(p, d) {
    const L = window.PDFLib; if (!L) { APP.toast('Libreria PDF non disponibile'); return; }
    const out = await L.PDFDocument.create(), font = await out.embedFont(L.StandardFonts.Helvetica), bold = await out.embedFont(L.StandardFonts.HelveticaBold);
    let scan = d.scan ? (d.scan.file ? await APP.FS.leggi(d.scan.file) : APP._scan) : null;
    if (scan) { try { const src = await L.PDFDocument.load(scan, { ignoreEncryption: true }); (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg)); } catch (e) { APP.toast('Scansione non leggibile: ' + e.message); } }
    else APP.toast('Nessuna scansione firmata: il PDF conterrà solo la documentazione fotografica');
    const parts = new Map(p.particelle.map(x => [x.id, x]));
    const W = 595.28, H = 841.89, mg = 42;
    let pg = null, y = 0, n = 0;
    for (const f of d.foto) {
      const dati = f.data ? Uint8Array.from(atob(f.data.split(',')[1]), ch => ch.charCodeAt(0)) : await APP.FS.leggi(f.file);
      if (!dati) continue;
      let im; try { im = await out.embedJpg(dati); } catch (e) { try { im = await out.embedPng(dati); } catch (e2) { continue; } }
      if (!pg || y < mg + 330) {
        pg = out.addPage([W, H]); y = H - mg;
        pg.drawText('DOCUMENTAZIONE FOTOGRAFICA – ' + (p.ente.nome || '') + ' – Ditta ' + d.n, { x: mg, y: y - 10, size: 10, font: bold }); y -= 30;
      }
      const maxW = W - 2 * mg, maxH = 330, k = Math.min(maxW / im.width, maxH / im.height), w = im.width * k, h = im.height * k;
      pg.drawImage(im, { x: mg + (maxW - w) / 2, y: y - h, width: w, height: h });
      const x = parts.get(f.part); n++;
      const did = 'Figura ' + n + (x ? '_Fg. ' + x.fg + ' Mapp.' + C.mappale(x) : '') + (f.did ? ' – ' + f.did : '');
      pg.drawText(did.replace(/[^\x20-\x7E -ÿ]/g, '-').slice(0, 110), { x: mg + (maxW - w) / 2, y: y - h - 12, size: 8.5, font });
      y -= h + 30;
    }
    const bytes = await out.save();
    await APP.FS.salva(APP.FS.dirDitta(p, d) + '/Stato di consistenza/Stato di consistenza - Ditta ' + d.n + ' (completo).pdf', bytes);
    d.ev.immissione = d.ev.immissione || {}; APP.salva(); APP.render();
  }

    ['Opera ed ente', ['pratica.oggetto', 'pratica.cup', 'pratica.urgenza', 'ente.nome', 'ente.ufficio', 'ente.indirizzo', 'ente.pec', 'ente.ruolo', 'ente.responsabile', 'ente.rup', 'ente.tecnico', 'ente.beneficiario', 'ente.tar', 'ente.tribunale', 'ente.bur', 'ente.link', 'luogo', 'oggi', 'mesiOcc']],
    ['Atti (estremi e data)', ES.iter.FASI.map(f => 'atti.' + f.k + '.testo')],
    ['Dati specifici della pratica', M.DATI.map(c => 'dati.' + c.k).concat(['premesse', 'visti'].map(k => 'dati.' + k + 'Elenco')).concat((p.campi || []).map(c => 'dati.' + c.k))],
    ['Tabelle e comandi', ['[[tabella particelle colonne=comune,fg,map,haareca,rd,ra,espr,servtot,occ]]', '[[tabella intestatari]]', '[[tabella indennita]]', '[[tabella consistenza]]', '[[tabella piano colonne=np,fg,map,qual,sup,espr,servtot,occ,ind]]', '[[planimetria scala=1000]]', '[[firma {{ente.ruolo}}|{{ente.responsabile}}]]', '[[salto]]', '{{#ditta.intestatari}} … {{/ditta.intestatari}}', '{{#ditta.particelle}} … {{/ditta.particelle}}', '{{#dati.premesse}} … {{/dati.premesse}}']]
  ];
  APP.editorModello = async (p, k) => {
    const lib = APP.lib(), md = APP.modello(k), propria = !!md.propria;
    const orig = propria ? md.testo : M.INTEGRATI[k].testo;
    let liv = p.modelli[k] ? 'pratica' : 'base';
    const testoLiv = l => (l === 'pratica' ? (p.modelli[k] || M.testo(k, null, lib)) : (propria ? md.testo : (lib.base[k] || orig)));
    const campi = GRUPPI_CAMPI(p).map(([g, L]) => `<details ${g === 'Dati specifici della pratica' ? 'open' : ''}><summary>${E(g)}</summary>${L.map(c => `<button type="button" class="s cmp" data-ins="${E(c.startsWith('[[') || c.startsWith('{{') ? c : '{{' + c + '}}')}">${E(c.replace(/^(dest|ditta|ente|pratica|atti|dati)\./, ''))}</button>`).join('')}</details>`).join('');
    const html = `${propria ? `<div class="g"><label class="f2">Nome del modello<input id="mnome" value="${E(md.nome)}"></label><label>Articolo<input id="mart" value="${E(md.art || '')}"></label><label>Fase<input id="mfase" value="${E(md.fase || '')}"></label><label>Un documento per<select id="mamb">${Object.entries(AMBITI).map(([a, t]) => `<option value="${a}" ${md.ambito === a ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>` : ''}
<div class="row" style="margin:6px 0"><label class="fl">Modifica<select id="mliv"><option value="base">${propria ? 'Testo del modello (tutte le pratiche)' : 'Testo base – vale per tutte le pratiche'}</option><option value="pratica">Solo per questa pratica</option></select></label><span class="mu grow" id="mstato"></span></div>
<div class="ed"><textarea id="mt" rows="26" spellcheck="true"></textarea><div class="ed-side"><div class="mu" style="margin-bottom:4px">Clic per inserire nel punto del cursore</div>${campi}</div></div>
<p class="mu">Righe: <b># titolo</b>, <b>## sottotitolo</b>, <b>&gt;&gt; testo a destra</b> (indirizzo), <b>- punto elenco</b>, <b>**grassetto**</b>, <b>++sottolineato++</b>. Una riga = un paragrafo. Le sezioni <b>{{#campo}}…{{/campo}}</b> compaiono solo se il campo è compilato.</p>
<div class="row"><button type="button" id="mprev">Anteprima con la prima ditta</button></div><div id="mpv" style="margin-top:8px"></div>`;
    const stato = l => ({ base: propria ? 'Modello vostro: il testo vale per tutte le pratiche.' : lib.base[k] ? 'Testo base modificato da voi (vale per tutte le pratiche).' : 'Testo originale del programma.', pratica: p.modelli[k] ? 'Questa pratica usa un testo proprio.' : 'Questa pratica usa il testo base: salvando qui crei una versione solo per questa pratica.' })[l];
    const r = await APP.dlg('Testo: ' + md.nome, html, [{ t: 'Ripristina', v: 'reset', d: true }].concat(propria ? [{ t: 'Elimina modello', v: 'del', d: true }] : []).concat([{ t: 'Annulla', v: '' }, { t: 'Salva', v: 'ok', p: true }]), b => {
      const ta = b.querySelector('#mt'), sl = b.querySelector('#mliv');
      const carica = () => { ta.value = testoLiv(liv); b.querySelector('#mstato').textContent = stato(liv); };
      sl.value = liv; carica();
      sl.onchange = () => { liv = sl.value; carica(); };
      b.querySelectorAll('[data-ins]').forEach(x => x.onclick = () => { const t = x.dataset.ins, i = ta.selectionStart, j = ta.selectionEnd; ta.value = ta.value.slice(0, i) + t + ta.value.slice(j); ta.focus(); ta.selectionStart = ta.selectionEnd = i + t.length; });
      b.querySelector('#mprev').onclick = async () => { try { b.querySelector('#mpv').innerHTML = await APP.anteprima(p, k, p.ditte.slice(0, 1).map(d => d.id), ta.value); } catch (e) { b.querySelector('#mpv').innerHTML = `<div class="ban err">${E(e.message)}</div>`; } };
    });
    const testo = $('#mt').value;
    if (r === 'ok') {
      if (propria) { const c = lib.custom.find(x => x.k === k); Object.assign(c, { nome: $('#mnome').value || c.nome, art: $('#mart').value, fase: $('#mfase').value, ambito: $('#mamb').value }); if (liv === 'base') c.testo = testo; }
      if (liv === 'pratica') p.modelli[k] = testo;
      else if (!propria) { if (testo === orig) delete lib.base[k]; else lib.base[k] = testo; }
      APP.toast(liv === 'pratica' ? 'Testo salvato per questa pratica' : 'Testo base salvato: vale per tutte le pratiche');
    }
    if (r === 'reset') {
      if (liv === 'pratica') delete p.modelli[k];
      else if (!propria && await APP.conferma('Tornare al testo originale del programma per tutte le pratiche?', 'Ripristina')) delete lib.base[k];
    }
    if (r === 'del' && await APP.conferma('Eliminare il modello «' + E(md.nome) + '» da tutte le pratiche?', 'Elimina')) { lib.custom.splice(lib.custom.findIndex(x => x.k === k), 1); Object.values(APP.DB.pratiche).forEach(x => { if (x.modelli) delete x.modelli[k]; }); }
    if (r) { APP.salva(); APP.render(); }
  };
  async function nuovoModello(p) {
    const cat = M.catalogo(APP.lib());
    const r = await APP.dlg('Nuovo modello', `<div class="g"><label class="f">Nome<input id="nn" placeholder="es. Richiesta di nulla osta allo svincolo"></label><label>Articolo<input id="na" placeholder="art. 28"></label><label>Fase<input id="nf" placeholder="Indennità"></label>
<label>Un documento per<select id="nb">${Object.entries(AMBITI).map(([a, t]) => `<option value="${a}">${t}</option>`).join('')}</select></label>
<label class="f">Parti dal testo di<select id="nc"><option value="">(foglio bianco con intestazione)</option>${Object.entries(cat).map(([k, v]) => `<option value="${k}">${E(v.nome)}</option>`).join('')}</select></label></div>`, [{ t: 'Annulla', v: '' }, { t: 'Crea e modifica', v: 'ok', p: true }]);
    if (r !== 'ok') return;
    const da = $('#nc').value, amb = $('#nb').value;
    const vuoto = amb === 'pratica' ? '# TITOLO\n## {{pratica.oggetto}}\n\nTesto…\n\n{{luogo}}, {{oggi}}\n[[firma {{ente.ruolo}}|{{ente.responsabile}}]]'
      : 'Prot. n. ________\t{{luogo}}, {{oggi}}\n**Ditta {{ditta.n}}**\n>> {{dest.saluto}}\n>> **{{dest.nome}}**\n>> {{dest.via}}\n>> {{dest.cittaCap}}\n\n**Oggetto: {{pratica.oggetto}}**\n\n{{dest.gentile}},\nTesto…\n[[tabella particelle colonne=fg,map,sup,espr,servtot,occ]]\n\nDistinti saluti.\n[[firma {{ente.ruolo}}|{{ente.responsabile}}]]';
    const c = { k: 'u_' + U.id(), nome: $('#nn').value || 'Nuovo modello', art: $('#na').value, fase: $('#nf').value || 'Modelli vostri', ambito: (da && cat[da].ambito) || amb, testo: da ? APP.testoModello(p, da) : vuoto };
    APP.lib().custom.push(c); APP.salva(); APP.render();
    return APP.editorModello(p, c.k);
  }
  async function caricaWord() {
    const [f] = await APP.scegliFile('.docx'); if (!f) return;
    let campi = [];
    try { campi = await ES.office.campiModello(f.buf); } catch (e) { APP.toast('File Word non leggibile: ' + e.message); return; }
    const amb = campi.some(x => /^dest\.|Nome_e_Cognome$|^via$/.test(x)) ? 'intestatario' : campi.some(x => /^#?ditte|^#?unEspr/.test(x)) ? 'pratica' : 'ditta';
    const r = await APP.dlg('Nuovo modello Word', `<div class="g"><label class="f">Nome<input id="wn" value="${E(f.nome.replace(/\.docx$/i, ''))}"></label><label>Un documento per<select id="wa"><option value="intestatario">ogni intestatario</option><option value="ditta">ogni ditta</option><option value="pratica">l'intera pratica</option></select></label></div><p class="mu">Campi trovati: ${campi.map(x => '<span class="tag">' + E(x) + '</span>').join(' ') || 'nessuno – inserisci nel Word i segnaposto {{campo}} o usa i campi di stampa unione'}</p>`, [{ t: 'Annulla', v: '' }, { t: 'Aggiungi', v: 'ok', p: true }], b => { b.querySelector('#wa').value = amb; });
    if (r !== 'ok') return;
    APP.DB.modelliWord = APP.DB.modelliWord || [];
    APP.DB.modelliWord.push({ id: U.id(), nome: $('#wn').value || f.nome, ambito: $('#wa').value, campi, dati: b64(new Uint8Array(f.buf)) });
    APP.salva(); APP.render();
  }
  function campiDisponibili() {
    const R = (a, b) => `<tr><td><code>${E(a)}</code></td><td>${E(b)}</td></tr>`;
    APP.dlg('Campi disponibili nei modelli', `<p class="mu">Nei modelli Word scrivi i segnaposto tra doppie graffe, es. <code>{{dest.nome}}</code>. Per ripetere una riga di tabella per ogni particella metti <code>{{#ditta.particelle}}</code> nella prima cella e <code>{{/ditta.particelle}}</code> nell'ultima. L'estratto di mappa: <code>{{%planimetria}}</code>. I campi di stampa unione già presenti (es. «Nome_e_Cognome1», «Foglio1», «Particella1», «haareca1», «Reddito_Domenicale1», «Sup1») sono riconosciuti.</p>
<table class="t"><tbody>${R('{{dest.saluto}} {{dest.nome}}', 'Destinatario (Egr. Sig. / Gent.ma Sig.ra / Spett.le e nome)')}${R('{{dest.via}} {{dest.cittaCap}} {{dest.pec}}', 'Indirizzo del destinatario')}${R('{{dest.anagrafica}}', 'ROSSI MARIO nato a … il … - CF: …')}${R('{{dest.diritto}}', "Proprieta' 1/2")}
${R('{{ditta.n}} {{ditta.np}}', 'Numero di ditta / NP1')}${R('{{ditta.tot}} {{ditta.totLettere}}', 'Indennità totale in cifre e in lettere')}${R('{{ditta.indEspr}} {{ditta.indServ}} {{ditta.indOcc}}', 'Indennità per tipo')}${R('{{ditta.supEspr}} {{ditta.supServ}} {{ditta.supOcc}}', 'Superfici per tipo')}
${R('{{#ditta.intestatari}} {{nome}} {{nascita}} {{cf}} {{diritto}} {{/ditta.intestatari}}', 'Elenco intestatari')}${R('{{#ditta.particelle}} {{comune}} {{fg}} {{mappale}} {{qualcls}} {{sup}} {{haareca}} {{rd}} {{ra}} {{espr}} {{servop}} {{serv}} {{occ}} {{confini}} {{ind}} {{/ditta.particelle}}', 'Righe delle particelle')}
${R('{{ditta.ev.immissione.data}} {{ditta.ev.immissione.ora}} {{ditta.ev.immissione.luogo}}', 'Data, ora e luogo dell\'immissione in possesso')}
${R('{{ente.nome}} {{ente.ruolo}} {{ente.responsabile}} {{ente.rup}} {{ente.pec}} {{ente.tecnico}}', 'Ente e firmatari')}${R('{{pratica.oggetto}} {{pratica.cup}}', 'Opera')}${R('{{atti.dpu.testo}} {{atti.vincolo.testo}} {{atti.com17.testo}} {{atti.decreto.testo}}', 'Estremi degli atti («Delibera G.C. n. 62 del 20/05/2024»)')}${R('{{luogo}} {{oggi}}', 'Luogo e data')}${R('{{#ditte}} … {{/ditte}} · {{#unEspr}} {{un}} {{np}} … {{/unEspr}}', 'Solo modelli per l\'intera pratica: ditte e unità negoziali')}</tbody></table>`);
  }

  // ---------- Vista: Scadenze ----------
  APP.viste.scadenze = (m, p) => {
    const L = I.scadenze(p), oggi = U.oggi();
    const cls = { scaduta: 't-ko', prossima: 't-wa', futura: '', fatto: 't-ok', attesa: '', ok: 't-ok' }, nomi = { scaduta: 'scaduta', prossima: 'entro 15 giorni', futura: 'in corso', fatto: 'superata', attesa: 'non prima del', ok: 'termine minimo rispettato' };
    m.innerHTML = `<h2>⏰ Scadenze</h2><p class="mu">Termini calcolati dalle date degli atti (scheda Pratica) e dei passi delle ditte. Sono promemoria: verificare sempre il testo vigente.</p>
<div class="tw"><table class="t"><thead><tr><th>Data</th><th>Stato</th><th>Termine</th><th>Fase</th><th>Art.</th><th>Ditta</th></tr></thead><tbody>
${L.map(s => { const st = I.statoScad(s, oggi); return `<tr ${s.ditta ? `data-d="${s.ditta.id}"` : ''}><td><b>${U.dataIt(s.data)}</b></td><td><span class="tag ${cls[st]}">${nomi[st]}</span></td><td style="white-space:normal">${E(s.cosa)}</td><td style="white-space:normal" class="mu">${E(s.fase)}</td><td class="mu">${E(s.art)}</td><td>${s.ditta ? 'Ditta ' + E(s.ditta.n) : ''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="vuoto">Nessuna scadenza: inserisci le date degli atti nella scheda Pratica e dei passi nelle ditte.</td></tr>'}</tbody></table></div>`;
    m.querySelectorAll('[data-d]').forEach(r => r.onclick = () => APP.vai('ditte', r.dataset.d));
  };

  // ---------- Vista: Normativa ----------
  APP.viste.normativa = m => { m.innerHTML = `<div class="card norm">${ES.NORMATIVA || ''}</div>`; };
})();

APP.avvia();
</script>
</body>
